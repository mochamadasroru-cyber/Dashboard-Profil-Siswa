const LS_KEY = "profil-siswa-v1";
const timers = {}, inflight = {}, again = {};
let pendingWrites = 0;

function setSaveState(t) { $("#saveState").textContent = t; }
function docData(id) {
  if (id === "kelas") return S.kelas;
  const s = S.students.find((x) => x.id === id);
  return s ? { ...s, id: undefined } : null;
}
function lsWrite() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ kelas: S.kelas, students: S.students })); }
  catch (e) { toast("Penyimpanan browser penuh. Kurangi ukuran foto."); }
}
function queueSave(id) {
  setSaveState("Menyimpan…");
  clearTimeout(timers[id]);
  timers[id] = setTimeout(() => flush(id), 700);
}
async function flush(id) {
  if (inflight[id]) { again[id] = true; return; }
  inflight[id] = true; pendingWrites++;
  try {
    const data = docData(id);
    if (S.mode === "db") {
      const ref = db.collection("data/users/" + uid).doc(id);
      if (data) await ref.set(JSON.parse(JSON.stringify(data))); else await ref.delete();
    } else lsWrite();
  } catch (e) {
    if (e && e.code === "invalid_argument") toast("Tidak bisa menyimpan. Pastikan Anda punya akses Contributor dan ukuran foto tidak terlalu besar.", 5000);
    else toast("Gagal menyimpan: " + (e?.message || e?.code || "coba lagi"));
  } finally {
    inflight[id] = false; pendingWrites--;
    if (again[id]) { again[id] = false; flush(id); }
    else if (!pendingWrites) setSaveState(S.mode === "db" ? "Tersimpan" : "Tersimpan di browser ini");
  }
}
async function loadAll() {
  const c = window.claude;
  if (c && typeof c.use === "function") {
    const [d, u, sm, dl] = await Promise.all([c.use("db"), c.use("user"), c.use("sample"), c.use("downloads")]);
    sample = sm; downloads = dl;
    if (d && u) { try { uid = await u.id(); } catch (e) { uid = null; } }
    if (d && uid) { db = d; S.mode = "db"; }
  }
  if (S.mode === "db") {
    const snap = await db.collection("data/users/" + uid).get();
    for (const doc of snap.docs) {
      if (doc.id === "kelas") S.kelas = doc.data();

}

/* ================= Gambar: kompres foto ================= */
function readImage(file, maxSide, type = "image/jpeg", quality = 0.82) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("File tidak bisa dibaca"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Format gambar tidak didukung"));
      img.onload = () => {
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL(type, quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const imgCache = new Map();
function loadImg(src) {
  if (!src) return Promise.resolve(null);
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  imgCache.set(src, p); return p;
}

const MM = 1588 / 210; // px kanvas per mm (kanvas 2x lebar halaman 794px)
const C = { purple: "#8b5cf6", purpleDark: "#6d3fe0", cyan: "#7be3f2", gold: "#f5b23e", dot: "#f8d68c", pink: "#e3aab2", red: "#d9505d", yellow: "#f3c33d", ink: "#2b2230", badge: "#c8f4fb", lav: "#ddd6fe" };

function star5(ctx, cx, cy, r, color) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo((cx + Math.cos(a) * rr) * MM, (cy + Math.sin(a) * rr) * MM);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}
function sparkle(ctx, cx, cy, r) {
  const p = (x, y) => [(cx + x) * MM, (cy + y) * MM];
  ctx.beginPath(); ctx.moveTo(...p(0, -r));
  ctx.quadraticCurveTo(...p(r * .12, -r * .12), ...p(r, 0));
  ctx.quadraticCurveTo(...p(r * .12, r * .12), ...p(0, r));
  ctx.quadraticCurveTo(...p(-r * .12, r * .12), ...p(-r, 0));
  ctx.quadraticCurveTo(...p(-r * .12, -r * .12), ...p(0, -r));
  ctx.fillStyle = C.gold; ctx.fill();
}
function leaf(ctx, pts) {
  const [x0, y0, cx1, cy1, x1, y1, cx2, cy2] = pts.map((v) => v * MM);
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.quadraticCurveTo(cx1, cy1, x1, y1); ctx.quadraticCurveTo(cx2, cy2, x0, y0);
  ctx.fillStyle = C.pink; ctx.fill();
}
function hexPath(ctx, x, y, w, hh) {
  ctx.beginPath();
  ctx.moveTo(x + .25 * w, y); ctx.lineTo(x + .75 * w, y); ctx.lineTo(x + w, y + hh / 2);
  ctx.lineTo(x + .75 * w, y + hh); ctx.lineTo(x + .25 * w, y + hh); ctx.lineTo(x, y + hh / 2); ctx.closePath();
}
function drawHex(ctx, img, xmm, ymm, wmm, hmm) {
  const x = xmm * MM, y = ymm * MM, w = wmm * MM, hh = hmm * MM, b = 1.4 * MM;
  hexPath(ctx, x, y, w, hh); ctx.fillStyle = C.purple; ctx.fill();
  ctx.save(); hexPath(ctx, x + b, y + b, w - 2 * b, hh - 2 * b); ctx.clip();
  ctx.fillStyle = C.lav; ctx.fillRect(x, y, w, hh);
  if (img) {
    const iw = w - 2 * b, ih = hh - 2 * b, sc = Math.max(iw / img.width, ih / img.height);
    const dw = img.width * sc, dh = img.height * sc;
    ctx.drawImage(img, x + b + (iw - dw) / 2, y + b + (ih - dh) / 2, dw, dh);
  } else {
    ctx.fillStyle = "#a78bfa"; ctx.font = `600 ${3.4 * MM}px Lexend, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("Foto", x + w / 2, y + hh / 2); ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  }
  ctx.restore();
}
function fitText(ctx, text, sizeMm, maxMm, minMm = 4.5) {
  let s = sizeMm;
  for (; s > minMm; s -= 0.2) { ctx.font = `${s * MM}px "Luckiest Guy"`; if (ctx.measureText(text).width <= maxMm * MM) break; }
  return s;
}
function titleText(ctx, text, xmm, topMm, sizeMm, maxMm, opt = {}) {
  const s = fitText(ctx, text, sizeMm, maxMm);
  const x = xmm * MM, y = (topMm + s * 0.86) * MM, lw = (opt.stroke ?? 1.1) * MM;
  ctx.font = `${s * MM}px "Luckiest Guy"`; ctx.lineJoin = "round"; ctx.miterLimit = 2;
  if (opt.shadow !== false) {
    ctx.fillStyle = C.purpleDark; ctx.strokeStyle = C.purpleDark; ctx.lineWidth = lw;
    ctx.strokeText(text, x + .55 * MM, y + .75 * MM); ctx.fillText(text, x + .55 * MM, y + .75 * MM);
  }
  ctx.strokeStyle = C.purple; ctx.lineWidth = lw; ctx.strokeText(text, x, y);
  ctx.fillStyle = opt.fill || C.cyan; ctx.fillText(text, x, y);
}

/* ================= Teks paragraf -> token kata (miring/tebal) ================= */
function tokenize(text, boldName) {
  // *istilah* = miring; **…** dibuang; nama lengkap ditebalkan otomatis
  let t = String(text || "").replace(/\*\*(.+?)\*\*/g, "$1").trim();
  const segs = [];
  const re = /\*([^*]+)\*/g; let last = 0, m;
  while ((m = re.exec(t))) { if (m.index > last) segs.push({ s: t.slice(last, m.index), i: false }); segs.push({ s: m[1], i: true }); last = re.lastIndex; }
  if (last < t.length) segs.push({ s: t.slice(last), i: false });
  const words = [];
  let prevSpace = true;
  for (const sg of segs) {
    const glueFirst = words.length > 0 && !prevSpace && !/^\s/.test(sg.s);
    sg.s.split(/\s+/).filter(Boolean).forEach((w, j) => words.push({ w, i: sg.i, b: false, glue: j === 0 && glueFirst }));
    prevSpace = /\s$/.test(sg.s);
  }
  if (boldName) {
    const nw = boldName.trim().split(/\s+/).map((x) => x.toLowerCase());
    const strip = (w) => w.toLowerCase().replace(/[.,;:!?)"']+$/, "");
    for (let i = 0; i + nw.length <= words.length; i++) {
      if (nw.every((x, j) => strip(words[i + j].w) === x)) for (let j = 0; j < nw.length; j++) words[i + j].b = true;
    }
  }
  return words;
}
function tokensHtml(words) {
  let out = "";
  words.forEach((w, n) => {
    let t = esc(w.w);
    if (w.i) t = `<em>${t}</em>`;
    if (w.b) t = `<strong>${t}</strong>`;
    out += (n && !w.glue ? " " : "") + t;
  });
  return out;
}

/* ================= Susun halaman (paginasi per kata) ================= */
function paragraphsOf(s) {
  const k = S.kelas, nama = s.nama || "";
  const list = [];
  const bulan = k.periode || "…", tahun = k.tahun || (k.tanggalCetak || "").slice(0, 4);
  list.push({ cls: "salam", words: tokenize("Assalamu'alaikum Warahmatullahi Wabarakatuh.") });
  list.push({ words: tokenize(`Salam hangat kami sampaikan kepada Ayah/Bunda Ananda ${nama}. Semoga Ayah/Bunda dan keluarga senantiasa diberikan kesehatan, keberkahan, serta selalu berada dalam lindungan Allah Swt.`) });
  list.push({ words: tokenize(`Puji syukur ke hadirat Tuhan Yang Maha Esa atas segala rahmat-Nya sehingga proses pembelajaran dan kegiatan sekolah selama bulan ${bulan} dapat berjalan dengan baik. Tak lupa selawat dan salam kita haturkan kepada Nabi Muhammad SAW., beserta keluarga, sahabat, dan pengikutnya hingga akhir zaman.`) });
  list.push({ words: tokenize(`Melalui profil kali ini, kami ingin menyampaikan perkembangan Ananda selama bulan ${bulan}${tahun ? " " + tahun : ""} berdasarkan pengamatan dan penilaian Bapak/Ibu guru selama kegiatan belajar dan aktivitas di sekolah.`) });
  for (const p of PARA_SECTIONS) for (const t of (s.final?.[p.id] || [])) if (t.trim()) list.push({ words: tokenize(t, nama) });
  list.push({ words: tokenize(`Demikian profil perkembangan ${sapaan()} ${nama} kami sampaikan. Terima kasih atas kerja sama dan dukungan Ayah/Bunda dalam mendampingi perkembangan ${sapaan()} di rumah.`) });
  return list;
}
function closingHtml() {
  const k = S.kelas;
  return `<div class="closing"><p>Wassalamu’alaikum warahmatullahi wabarakatuh.</p>
    <div class="sign">${esc(k.kota || "")}, ${esc(tanggalIndo(k.tanggalCetak))}<br>Wali Kelas, ${esc(k.labelTtd || k.namaKelas || "")}
    ${k.ttd ? `<img src="${k.ttd}" alt="">` : `<div class="gap"></div>`}${esc(k.waliKelas || "")}</div></div>`;
}
async function buildPages(s, stage, tplIn) {
  const tpl = tplIn || await resolveTpl(activeTplMeta());
  await ensureFonts(tpl);
  const nameUp = (s.nama || "Nama Siswa").toUpperCase(), kelasUp = (S.kelas.namaKelas || "Kelas").toUpperCase();
  let l1, l2;
  if (tpl.builtin) {
    [l1, l2] = await Promise.all([
      renderHeader({ first: true, name: nameUp, kelas: kelasUp, photos: { group: S.kelas.fotoBersama, portrait: s.fotoPortrait, activity: s.fotoKegiatan } }),
      renderHeader({ first: false, name: nameUp, kelas: kelasUp }),
    ]);
  } else {
    [l1, l2] = await Promise.all([renderLayer(tpl, "first", s), renderLayer(tpl, "next", s)]);
  }
  const b1 = bodyBox(tpl, "first"), b2 = bodyBox(tpl, "next");
  stage.innerHTML = "";
  const pages = [];
  const newPage = () => {
    const first = !pages.length, b = first ? b1 : b2;
    const pg = h(`<div class="pg${tpl.builtin ? "" : " custom"}" style="${typoVars(tpl)}"><img class="${tpl.builtin ? "pg-head" : "pg-layer"}" src="${first ? l1 : l2}" alt="">
      <div class="pg-body" style="left:${b.x * PXMM}px;top:${b.y * PXMM}px;width:${b.w * PXMM}px;height:${b.h * PXMM}px"><div class="pg-flow"></div></div></div>`);
    stage.append(pg); pages.push(pg); return pg;
  };
  let pg = newPage(), flow = $(".pg-flow", pg), body = $(".pg-body", pg);
  const fits = () => flow.offsetHeight <= body.clientHeight + 0.5;
  const next = () => { pg = newPage(); flow = $(".pg-flow", pg); body = $(".pg-body", pg); };

  for (const para of paragraphsOf(s)) {
    let words = para.words, cont = false;
    while (words.length) {
      const el = document.createElement("p");
      if (para.cls) el.className = para.cls;
      if (cont) el.classList.add("cont");
      el.innerHTML = tokensHtml(words); flow.append(el);
      if (fits()) break;
      // cari jumlah kata terbanyak yang muat di sisa halaman ini
      let lo = 0, hi = words.length - 1;
      while (lo < hi) { const mid = Math.ceil((lo + hi + 1) / 2); el.innerHTML = tokensHtml(words.slice(0, mid)); if (fits()) lo = mid; else hi = mid - 1; }
      const pageHasOther = flow.children.length > 1;
      // hindari sisa 1–2 baris yatim di bawah halaman: pindahkan utuh
      if (lo < 14 && pageHasOther) { el.remove(); next(); continue; }
      // hindari sisa sangat pendek di halaman berikutnya: bawa beberapa kata ikut pindah
      if (words.length - lo < 10 && lo > 30) lo = words.length - 10;
      el.innerHTML = tokensHtml(words.slice(0, lo)); el.classList.add("split");
      words = words.slice(lo); cont = true; next();
    }
  }
  const cl = h(closingHtml()); flow.append(cl);
  if (!fits()) { cl.remove(); next(); flow.append(h(closingHtml())); }
  await Promise.all([...stage.querySelectorAll("img")].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));
  return pages;
}

function warningsFor(s) {
  const w = [], f = s.final || {}, inp = s.input || {};
  const all = PARA_SECTIONS.flatMap((p) => f[p.id] || []).join(" ");
  if (!all.trim()) return w;
  const low = all.toLowerCase();
  if (/\{\{|\}\}/.test(all)) w.push("Masih ada placeholder {{…}} di teks.");
  if (/\bpraktek\b/i.test(all)) w.push('Ejaan "praktek" sebaiknya "praktik".');
  if (/\*\*/.test(all)) w.push("Ada tanda ** (tebal) yang akan dibuang saat cetak.");
  const items = (str) => String(str || "").split(/,|\bdan\b/i).map((x) => x.trim()).filter((x) => x.length > 2);
  for (const x of [...items(inp.ekskul), ...items(inp.lomba)]) {
    const key = x.toLowerCase().replace(/praktek/g, "praktik");
    if (!low.replace(/praktek/g, "praktik").includes(key)) w.push(`"${x}" dari data tidak ditemukan di paragraf. Cek apakah tertulis atau ejaannya berubah.`);
  }
  const disiplin = (f.kedisiplinan || []).join(" ");
  for (const [k, lbl] of [["sakit", "sakit"], ["izin", "izin"], ["alfa", "alfa"]]) {
    const n = parseInt(inp[k], 10);
    if (n > 0 && !new RegExp(`\\b${n}\\s*kali`).test(disiplin)) w.push(`Jumlah ${lbl} (${n} kali) belum tertulis di paragraf kehadiran.`);
  }
  if (["sakit", "izin", "alfa"].some((k) => String(inp[k] ?? "").trim()) && !disiplin.trim()) w.push("Ada data kehadiran, tetapi paragraf kehadiran masih kosong.");
  if (!(f.akademik || []).length) w.push("Bagian akademik masih kosong.");
  if (!(f.kesimpulan || []).length) w.push("Bagian kesimpulan masih kosong.");
  return w;
}

function openEditor(t, isNew) {
  const sampleStu = cur() || { nama: "Nama Siswa", fotoPortrait: "", fotoKegiatan: "" };
  const imgs = { first: null, next: null }, changed = {};
  let page = "first", sel = t.els.find((e) => e.kind === "body" && e.page === "first")?.id, layerTimer = 0;
  t.body = { ...DEFAULT_BODY, ...(t.body || {}) };

  const ed = h(`<div class="ed" role="dialog" aria-modal="true" aria-label="Editor desain PDF">
    <div class="ed-top">
      <input id="edName" value="${esc(t.nama)}" aria-label="Nama desain" placeholder="mis. Desain Oktober 2026">
      <span class="save-state" id="edState"></span>
      <button class="btn" id="edCancel">Batal</button>
      <button class="btn primary" id="edSave">Simpan desain</button>
    </div>
    <div class="ed-main">
      <aside class="ed-side" id="edSide"></aside>
      <div class="ed-view" id="edView"><div class="ed-slot" id="edSlot"><div class="ed-page" id="edPage">
        <img class="pg-layer" id="edLayer" alt=""><div class="pg-body" id="edBody"><div class="pg-flow"></div></div><div id="edBoxes"></div>
      </div></div></div>
    </div></div>`);
  document.body.append(ed);
  const view = $("#edView", ed), slot = $("#edSlot", ed), pageEl = $("#edPage", ed);
  let k = 1;
  const fit = () => {
    const availW = view.clientWidth - 40, availH = view.clientHeight - 40;
    k = Math.max(0.2, Math.min(availW / 794, (availH > 300 ? availH : 1123) / 1123, 1));
    pageEl.style.transform = `scale(${k})`; slot.style.width = 794 * k + "px"; slot.style.height = 1123 * k + "px";
  };
  const ro = new ResizeObserver(fit); ro.observe(view);

  const els = () => t.els.filter((e) => e.page === page);
  const selEl = () => t.els.find((e) => e.id === sel);
  const label = (e) => e.kind === "body" ? "Area teks paragraf" : e.kind === "nama" ? "Nama siswa" : e.kind === "kelas" ? "Nama kelas" : PHOTO_SRC[e.src] || "Foto";

  async function paintLayer() {
    const tpl = { ...t, bgFirstSrc: imgs.first, bgNextSrc: imgs.next };
    await ensureFonts(tpl);
    $("#edLayer", ed).src = await renderLayer(tpl, page, sampleStu);
  }
  const queueLayer = () => { clearTimeout(layerTimer); layerTimer = setTimeout(paintLayer, 120); };
  function paintBody() {
    const b = els().find((e) => e.kind === "body");
    const body = $("#edBody", ed);
    pageEl.setAttribute("style", pageEl.getAttribute("style").replace(/--[^;]+;?/g, "") + ";" + typoVars(t));
    pageEl.style.transform = `scale(${k})`;
    if (!b) { body.hidden = true; return; }
    body.hidden = false;
    Object.assign(body.style, { left: b.x * PXMM + "px", top: b.y * PXMM + "px", width: b.w * PXMM + "px", height: b.h * PXMM + "px" });
    const paras = page === "first"
      ? [`<p class="salam">Assalamu'alaikum Warahmatullahi Wabarakatuh.</p>`, ...SAMPLE_TEXT.map((x) => `<p>${esc(x)}</p>`)]
      : [...SAMPLE_TEXT, ...SAMPLE_TEXT].map((x) => `<p>${esc(x)}</p>`);
    $(".pg-flow", body).innerHTML = paras.join("");
  }
  function paintBoxes() {
    const wrap = $("#edBoxes", ed);
    wrap.replaceChildren(...els().map((e) => {
      const bx = h(`<div class="ebox ${e.kind === "body" ? "body" : ""} ${e.id === sel ? "on" : ""}" style="left:${e.x * PXMM}px;top:${e.y * PXMM}px;width:${e.w * PXMM}px;height:${e.h * PXMM}px"><span class="tag">${esc(label(e))}</span><span class="rs" aria-hidden="true"></span></div>`);
      bx.addEventListener("pointerdown", (ev) => startDrag(ev, e, ev.target.classList.contains("rs") ? "resize" : "move", bx));
      return bx;
    }));
  }
  function startDrag(ev, e, mode, bx) {
    ev.preventDefault(); ev.stopPropagation();
    if (sel !== e.id) { sel = e.id; paintSide(); }
    wrapSel(bx);
    const sx = ev.clientX, sy = ev.clientY, o = { x: e.x, y: e.y, w: e.w, h: e.h };
    bx.setPointerCapture(ev.pointerId);
    const snap = (v) => Math.round(v * 2) / 2;
    const move = (m) => {
      const dx = (m.clientX - sx) / k / PXMM, dy = (m.clientY - sy) / k / PXMM;
      if (mode === "move") { e.x = snap(Math.min(Math.max(o.x + dx, -5), 210 - o.w + 5)); e.y = snap(Math.min(Math.max(o.y + dy, -5), 297 - o.h + 5)); }
      else { e.w = snap(Math.max(8, Math.min(o.w + dx, 215 - e.x))); e.h = snap(Math.max(6, Math.min(o.h + dy, 302 - e.y))); }
      Object.assign(bx.style, { left: e.x * PXMM + "px", top: e.y * PXMM + "px", width: e.w * PXMM + "px", height: e.h * PXMM + "px" });
      if (e.kind === "body") paintBody();
      syncPos(e);
    };
    const up = () => { bx.removeEventListener("pointermove", move); bx.removeEventListener("pointerup", up); bx.removeEventListener("pointercancel", up); if (e.kind !== "body") queueLayer(); };
    bx.addEventListener("pointermove", move); bx.addEventListener("pointerup", up); bx.addEventListener("pointercancel", up);
  }
  function wrapSel(bx) { $("#edBoxes", ed).querySelectorAll(".ebox").forEach((b) => b.classList.toggle("on", b === bx)); }
  function syncPos(e) { for (const kk of ["x", "y", "w", "h"]) { const inp = $(`#ep_${kk}`, ed); if (inp && document.activeElement !== inp) inp.value = e[kk]; } }

  function bgBlock(key, title, hint) {
    return `<div class="photo"><div class="thumb ${imgs[key] ? "has" : ""}" style="width:52px;height:74px;${imgs[key] ? `background-image:url('${imgs[key]}')` : ""}"></div>
      <div class="meta"><span>${title}</span><span class="hint">${hint}</span><span style="display:flex;gap:6px"><span class="btn sm file-btn">Unggah<input type="file" accept="image/png,image/jpeg" data-bg="${key}" aria-label="${title}"></span>${imgs[key] ? `<button class="btn sm ghost" data-bgclr="${key}">Hapus</button>` : ""}</span></div></div>`;
  }
  function propsHtml(e) {
    if (!e) return `<p class="hint" style="margin:0">Klik kotak di halaman untuk mengatur posisinya.</p>`;
    const pos = `<div class="fields">${[["x", "Kiri (mm)"], ["y", "Atas (mm)"], ["w", "Lebar (mm)"], ["h", "Tinggi (mm)"]].map(([kk, l]) => `<div class="f"><label for="ep_${kk}">${l}</label><input type="number" step="0.5" id="ep_${kk}" data-pos="${kk}" value="${e[kk]}"></div>`).join("")}</div>`;
    if (e.kind === "body") return `<p class="hint" style="margin:0 0 8px">Paragraf mengalir di dalam kotak ini. Jika penuh, otomatis lanjut ke area teks halaman berikutnya.</p>${pos}`;
    if (e.kind === "foto") return `<div class="fields">
      <div class="f" style="grid-column:1/-1"><label for="ep_src">Isi foto</label><select id="ep_src" data-p="src">${Object.entries(PHOTO_SRC).map(([v, l]) => `<option value="${v}" ${e.src === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="f"><label for="ep_shape">Bentuk</label><select id="ep_shape" data-p="shape">${Object.entries(SHAPES).map(([v, l]) => `<option value="${v}" ${e.shape === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="f"><label for="ep_border">Warna bingkai</label><input type="color" id="ep_border" data-p="border" value="${e.border || "#8b5cf6"}"></div>
      <div class="f" style="grid-column:1/-1"><label for="ep_bw">Tebal bingkai: <span id="ep_bwv">${e.borderW ?? 0} mm</span></label><input type="range" min="0" max="4" step="0.2" id="ep_bw" data-p="borderW" data-num value="${e.borderW ?? 0}"></div>
      </div>${pos}<button class="btn sm danger" id="epDel">Hapus foto ini</button>`;
    return `<div class="fields">
      <div class="f" style="grid-column:1/-1"><label for="ep_font">Huruf</label><select id="ep_font" data-p="font">${FONTS_TITLE.map((f) => `<option ${e.font === f ? "selected" : ""}>${f}</option>`).join("")}</select></div>
      <div class="f"><label for="ep_color">Warna huruf</label><input type="color" id="ep_color" data-p="color" value="${e.color || "#111111"}"></div>
      <div class="f"><label for="ep_stroke">Warna garis tepi</label><input type="color" id="ep_stroke" data-p="stroke" value="${e.stroke || "#000000"}"></div>
      <div class="f" style="grid-column:1/-1"><label for="ep_sw">Tebal garis tepi: <span id="ep_swv">${e.strokeW ?? 0} mm</span></label><input type="range" min="0" max="2.5" step="0.1" id="ep_sw" data-p="strokeW" data-num value="${e.strokeW ?? 0}"></div>
      <div class="f"><label for="ep_align">Rata</label><select id="ep_align" data-p="align">${[["left", "Kiri"], ["center", "Tengah"], ["right", "Kanan"]].map(([v, l]) => `<option value="${v}" ${e.align === v ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <div class="f checks" style="justify-content:flex-end"><label><input type="checkbox" data-p="upper" ${e.upper ? "checked" : ""}>Huruf kapital</label><label><input type="checkbox" data-p="shadow" ${e.shadow ? "checked" : ""}>Bayangan</label></div>
      </div><p class="hint" style="margin:0">Ukuran huruf menyesuaikan tinggi kotak dan mengecil otomatis untuk nama yang panjang.</p>${pos}<button class="btn sm danger" id="epDel">Hapus ${e.kind === "nama" ? "nama" : "kelas"} dari halaman ini</button>`;
  }
  function paintSide() {
    const side = $("#edSide", ed), e = selEl(), b = t.body;
    const has = (kind) => els().some((x) => x.kind === kind);
    side.replaceChildren(h(`<div style="display:flex;flex-direction:column;gap:16px">
      <div class="ed-help"><strong>Cara menyiapkan desain di Canva</strong><ol>
        <li>Buat desain ukuran A4 (210 × 297 mm), 2 halaman: halaman pertama dan halaman lanjutan.</li>
        <li>Kosongkan bagian nama siswa, kelas, foto siswa, dan isi paragraf. Bagian itu diisi otomatis dari sini.</li>
        <li>Bagikan → Unduh → PNG, lalu unggah tiap halaman di bawah ini.</li></ol></div>
      <div><h4>Gambar latar</h4><div style="display:flex;flex-direction:column;gap:10px">
        ${bgBlock("first", "Halaman pertama", "Desain dengan judul/kepala")}
        ${bgBlock("next", "Halaman lanjutan", "Kosong = pakai halaman pertama")}</div></div>
      <div><h4>Halaman yang diatur</h4><div class="seg" role="group" aria-label="Halaman"><button data-pg="first" aria-pressed="${page === "first"}">Halaman pertama</button><button data-pg="next" aria-pressed="${page === "next"}">Halaman lanjutan</button></div></div>
      <div><h4>Elemen di halaman ini</h4><div class="el-list">${els().map((x) => `<button class="el-item" data-sel="${x.id}" aria-current="${x.id === sel}"><span class="sw" style="background:${x.kind === "body" ? "#1f8a5b" : "#6d3fe0"}"></span>${esc(label(x))}</button>`).join("")}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${has("nama") ? "" : `<button class="btn sm" data-add="nama">+ Nama siswa</button>`}${has("kelas") ? "" : `<button class="btn sm" data-add="kelas">+ Nama kelas</button>`}<button class="btn sm" data-add="foto">+ Foto</button></div></div>
      <div><h4>${e ? esc(label(e)) : "Atur elemen"}</h4>${propsHtml(e)}</div>
      <div><h4>Teks paragraf (semua halaman)</h4><div class="fields">
        <div class="f" style="grid-column:1/-1"><label for="eb_font">Huruf</label><select id="eb_font" data-b="font">${FONTS_BODY.map((f) => `<option ${b.font === f ? "selected" : ""}>${f}</option>`).join("")}</select></div>
        <div class="f"><label for="eb_size">Ukuran (pt)</label><input type="number" min="7" max="14" step="0.1" id="eb_size" data-b="sizePt" value="${b.sizePt}"></div>
        <div class="f"><label for="eb_color">Warna</label><input type="color" id="eb_color" data-b="color" value="${b.color}"></div>
        <div class="f"><label for="eb_lh">Spasi baris</label><input type="number" min="1.1" max="2.2" step="0.02" id="eb_lh" data-b="lineHeight" value="${b.lineHeight}"></div>
        <div class="f"><label for="eb_gap">Jarak paragraf (mm)</label><input type="number" min="0" max="10" step="0.2" id="eb_gap" data-b="gapMm" value="${b.gapMm}"></div>
        <div class="f"><label for="eb_ind">Inden awal (mm)</label><input type="number" min="0" max="20" step="0.5" id="eb_ind" data-b="indentMm" value="${b.indentMm}"></div>
      </div></div></div>`));
    side.querySelectorAll("[data-pg]").forEach((bt) => bt.onclick = () => { page = bt.dataset.pg; sel = els().find((x) => x.kind === "body")?.id; repaint(); });
    side.querySelectorAll("[data-sel]").forEach((bt) => bt.onclick = () => { sel = bt.dataset.sel; paintSide(); paintBoxes(); });
    side.querySelectorAll("[data-add]").forEach((bt) => bt.onclick = () => {
      const kind = bt.dataset.add, base = { id: rid(), kind, page };
      const ne = kind === "foto" ? { ...base, x: 140, y: 20, w: 45, h: 45, src: "portrait", shape: "circle", border: "#8b5cf6", borderW: 1.4 }
        : { ...base, x: 18, y: kind === "nama" ? 30 : 47, w: 120, h: kind === "nama" ? 15 : 12, font: "Luckiest Guy", color: "#7be3f2", stroke: "#8b5cf6", strokeW: 1, shadow: true, align: "left", upper: true };
      t.els.push(ne); sel = ne.id; repaint();
    });
    side.querySelectorAll("[data-bg]").forEach((inp) => inp.onchange = async () => {
      const file = inp.files?.[0]; if (!file) return;
      try {
        const d = await fitBackground(file); imgs[inp.dataset.bg] = d; changed[inp.dataset.bg] = true;
        const im = await loadImg(d); if (im && Math.abs(im.height / im.width - 297 / 210) > 0.04) toast("Ukuran gambar bukan A4, jadi akan sedikit direnggangkan. Sebaiknya ekspor dari desain A4.", 5000);
        repaint();
      } catch (er) { toast(er.message); }
    });
    side.querySelectorAll("[data-bgclr]").forEach((bt) => bt.onclick = () => { imgs[bt.dataset.bgclr] = null; changed[bt.dataset.bgclr] = true; repaint(); });
    side.querySelectorAll("[data-p]").forEach((inp) => {
      const ev = inp.type === "range" || inp.type === "color" ? "input" : "change";
      inp.addEventListener(ev, () => {
        const ee = selEl(); if (!ee) return;
        ee[inp.dataset.p] = inp.type === "checkbox" ? inp.checked : inp.dataset.num != null ? parseFloat(inp.value) : inp.value;
        if (inp.id === "ep_bw") $("#ep_bwv", ed).textContent = inp.value + " mm";
        if (inp.id === "ep_sw") $("#ep_swv", ed).textContent = inp.value + " mm";
        queueLayer(); if (inp.dataset.p === "src") { paintBoxes(); $(`[data-sel="${ee.id}"]`, ed).lastChild.textContent = label(ee); }
      });
    });
    side.querySelectorAll("[data-pos]").forEach((inp) => inp.addEventListener("input", () => {
      const ee = selEl(), v = parseFloat(inp.value); if (!ee || isNaN(v)) return;
      ee[inp.dataset.pos] = v; paintBoxes(); if (ee.kind === "body") paintBody(); else queueLayer();
    }));
    side.querySelectorAll("[data-b]").forEach((inp) => inp.addEventListener("input", () => {
      t.body[inp.dataset.b] = inp.type === "number" ? parseFloat(inp.value) || t.body[inp.dataset.b] : inp.value; paintBody();
    }));
    const del = $("#epDel", ed);
    if (del) del.onclick = () => { t.els = t.els.filter((x) => x.id !== sel); sel = els().find((x) => x.kind === "body")?.id; repaint(); };
  }
  function repaint() { paintSide(); paintBody(); paintBoxes(); queueLayer(); }

  $("#edCancel", ed).onclick = () => { ro.disconnect(); ed.remove(); openTemplates(); };
  $("#edSave", ed).onclick = async () => {
    t.nama = $("#edName", ed).value.trim() || "Desain tanpa nama";
    const btn = $("#edSave", ed); btn.disabled = true; $("#edState", ed).textContent = "Menyimpan…";
    try {
      const up = {}; for (const kk of ["first", "next"]) if (changed[kk]) up[kk] = imgs[kk];
      const meta = await saveTemplate(t, up);
      if (isNew && S.kelas) { S.kelas.templateId = meta.id; queueSave("kelas"); }
      ro.disconnect(); ed.remove(); render();
      toast(isNew ? `Desain "${meta.nama}" disimpan dan dipakai untuk kelas ini.` : `Desain "${meta.nama}" disimpan.`);
    } catch (e) {
      btn.disabled = false; $("#edState", ed).textContent = "";
      toast(e?.code === "invalid_argument" ? "Tidak bisa menyimpan. Pastikan Anda punya akses Contributor, atau kecilkan gambar latar." : "Gagal menyimpan: " + (e.message || e.code), 5000);
    }
  };
  (async () => {
    for (const kk of ["first", "next"]) if (t.bg?.[kk]) imgs[kk] = await getTplImage(`${t.id}_${kk}`);
    fit(); repaint();
  })();
}

function renderList() {

/* ================= Tab: Paragraf ================= */
function srcHtml(s, secId) {
  const sec = SECTIONS.find((x) => x.id === secId), inp = s.input || {};
  if (!sec) return "";
  const rows = [];
  for (const f of sec.fields) {
    if (f.type === "kegiatan") {
      const skip = new Set(inp.kegiatanSkip || []);
      const ikut = (S.kelas.kegiatan || []).filter((g) => !skip.has(g.id)).map((g) => g.nama);
      if (ikut.length) rows.push([f.label, ikut.join(", ")]); continue;
    }
    if (String(inp[f.k] ?? "").trim()) rows.push([f.label, f.type === "num" ? `${inp[f.k]} kali` : inp[f.k]]);
  }
  if (secId === "kesimpulan") { if (inp.kelebihan) rows.push(["Kelebihan", inp.kelebihan]); }
  return rows.length ? `<dl>${rows.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>` : `<span>Tidak ada data guru untuk bagian ini.</span>`;
}
function renderParas(body, s) {
  const f = s.final || (s.final = {});
  const warns = warningsFor(s);
  const total = PARA_SECTIONS.reduce((n, p) => n + (f[p.id] || []).length, 0);
  body.replaceChildren(h(`<div>
    ${!total ? `<div class="notice info"><div>Paragraf belum ada. Klik <strong>Tulis paragraf dengan AI</strong>, atau ketik sendiri dengan tombol "+ Paragraf" di tiap bagian. Tandai istilah asing dengan *bintang* agar tercetak miring.</div></div>` : ""}
    ${warns.length ? `<div class="notice warn"><div><strong>Periksa sebelum cetak</strong><ul>${warns.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></div></div>` : ""}
    ${total ? `<div class="notice info"><div>Bandingkan setiap paragraf dengan data guru di kolom kiri. AI bisa keliru menambah detail yang tidak ada di data.</div></div>` : ""}
    ${PARA_SECTIONS.map((p) => `<div class="para-sec" data-sec="${p.id}">
      <div><h3>${esc(p.title)}</h3><div class="src">${srcHtml(s, p.id)}</div></div>
      <div><div class="para-list">${(f[p.id] || []).map((t, i) => `<div class="para"><textarea data-i="${i}" aria-label="${esc(p.title)} paragraf ${i + 1}">${esc(t)}</textarea>
        <div class="para-tools"><button class="btn sm ghost" data-up="${i}" ${i ? "" : "disabled"}>Naikkan</button><button class="btn sm ghost danger" data-rm="${i}">Hapus</button></div></div>`).join("") || `<span class="empty-sec">Tidak ada paragraf (bagian ini tidak dicetak).</span>`}</div>
        <div style="margin-top:8px"><button class="btn sm" data-add>+ Paragraf</button></div></div>
    </div>`).join("")}
  </div>`));
  const autosize = (ta) => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 2 + "px"; };
  body.querySelectorAll(".para-sec").forEach((secEl) => {
    const id = secEl.dataset.sec;
    secEl.querySelectorAll("textarea").forEach((ta) => { autosize(ta); ta.oninput = () => { f[id][+ta.dataset.i] = ta.value; autosize(ta); touch(s); }; });
    secEl.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { f[id].splice(+b.dataset.rm, 1); touch(s); renderParas(body, s); });
    secEl.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => { const i = +b.dataset.up; [f[id][i - 1], f[id][i]] = [f[id][i], f[id][i - 1]]; touch(s); renderParas(body, s); });
    secEl.querySelector("[data-add]").onclick = () => { (f[id] = f[id] || []).push(""); touch(s); renderParas(body, s); const tas = secEl.parentElement.querySelectorAll(`[data-sec="${id}"] textarea`); tas[tas.length - 1]?.focus(); };
  });
}

/* ================= Tab: Pratinjau ================= */
async function renderPreview(body, s) {
  body.replaceChildren(h(`<div class="preview-wrap"><div class="pv-count"><span>Menyusun halaman…</span></div></div>`));
  const wrap = $(".preview-wrap", body);
  const stage = document.createElement("div"); stage.style.cssText = "position:fixed;left:0;top:0;z-index:-10;pointer-events:none;opacity:0;";
  document.body.append(stage);
  try {
    const pages = await buildPages(s, stage);
    if (!body.isConnected) return;
    const avail = Math.min(wrap.clientWidth - 32, 794), sc = avail / 794;
    wrap.replaceChildren(h(`<div class="pv-count"><span>${pages.length} halaman A4</span><span>${statusOf(s) === "siap" ? "" : "Paragraf belum diisi"}</span></div>`));
    for (const pg of pages) {
      const slot = h(`<div class="pv-slot" style="width:${794 * sc}px;height:${1123 * sc}px"></div>`);
      pg.classList.add("pv-page"); pg.style.transform = `scale(${sc})`; slot.append(pg); wrap.append(slot);
    }
  } catch (e) { wrap.replaceChildren(h(`<div class="notice bad">Pratinjau gagal: ${esc(e.message || e)}</div>`)); }
  finally { stage.remove(); }
}

/* ================= Aksi: AI, unduh ================= */
function progressDialog(title) {
  const ctl = new AbortController();
  const el = h(`<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog">
    <h3>${esc(title)}</h3><p id="pgText">Menyiapkan…</p><div class="bar"><div id="pgBar"></div></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn" id="pgStop">Hentikan</button></div></div></div>`);
  document.body.append(el);
  $("#pgStop", el).onclick = () => ctl.abort();
  return { signal: ctl.signal, set(t, frac) { $("#pgText", el).textContent = t; if (frac != null) $("#pgBar", el).style.width = Math.round(frac * 100) + "%"; }, close() { el.remove(); } };
}
async function runAI(list) {
  if (!sample) return toast("AI tidak tersedia di tampilan ini.");
  const todo = list.filter((s) => statusOf(s) !== "kosong");
  if (!todo.length) return toast("Isi data siswa dulu sebelum menulis paragraf.");
  const dlg = progressDialog(todo.length > 1 ? "Menulis paragraf seluruh kelas" : "Menulis paragraf");
  let done = 0;
  try {
    for (const s of todo) {
      if (dlg.signal.aborted) break;
      dlg.set(`${s.nama || "Siswa"}: AI sedang menulis… biasanya 20–60 detik.`, done / todo.length);
      s.final = await generateFor(s, dlg.signal);
      done++; touch(s);
    }
    dlg.close();
    toast(done ? `Paragraf selesai untuk ${done} siswa. Periksa dulu sebelum dicetak.` : "Dihentikan.");
  } catch (e) {
    dlg.close();
    const m = { cancelled: "Dihentikan.", not_granted: "Izin memakai Claude ditolak. AI tidak bisa dipakai di tampilan ini.", rate_limited: "Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.", invalid_json: "Jawaban AI tidak terbaca. Coba lagi." };
    toast((done ? `${done} siswa selesai. ` : "") + (m[e?.code] || "AI gagal: " + (e?.message || e?.code || "coba lagi")), 5000);
  }
  if (cur() && todo.includes(cur())) S.tab = "paragraf";
  renderList(); renderWork();
}
async function downloadOne(s) {
  if (statusOf(s) !== "siap") toast("Paragraf belum diisi, PDF hanya berisi pembuka dan penutup.");
  const dlg = progressDialog("Membuat PDF");
  try { dlg.set(`Menyusun ${s.nama || "profil"}…`, .3); const blob = await pdfBlob(s); dlg.close(); await saveFile(pdfName(s), blob); }
  catch (e) { dlg.close(); toast("PDF gagal dibuat: " + (e.message || e)); }
}
async function downloadZip() {
  const list = S.students.filter((s) => statusOf(s) === "siap");
  if (!list.length) return toast("Belum ada siswa yang siap cetak.");
  const dlg = progressDialog("Membuat PDF satu kelas");
  try {
    const zip = new JSZip();
    for (let i = 0; i < list.length; i++) {
      if (dlg.signal.aborted) { dlg.close(); return toast("Dihentikan."); }
      dlg.set(`${i + 1}/${list.length} · ${list[i].nama}`, i / list.length);
      zip.file(pdfName(list[i]), await pdfBlob(list[i]));
    }
    dlg.set("Mengemas ZIP…", 1);
    const blob = await zip.generateAsync({ type: "blob" });
    dlg.close();
    await saveFile(`Profil_${(S.kelas.namaKelas || "Kelas").replace(/[^\p{L}\p{N}]+/gu, "_")}_${(S.kelas.periode || "").replace(/[^\p{L}\p{N}]+/gu, "_")}.zip`, blob);
  } catch (e) { dlg.close(); toast("Gagal membuat ZIP: " + (e.message || e)); }
}

  };
  kegRender();
  $("#kegAdd", el).onclick = () => { k.kegiatan.push({ id: "k" + rid(), nama: "", tanggal: "" }); kegRender(); el.querySelectorAll(".keg-row input")[k.kegiatan.length * 2 - 2]?.focus(); };
  $("#k_fb", el).onchange = async (e) => { try { k.fotoBersama = await readImage(e.target.files[0], 900); $("#k_fbT", el).style.backgroundImage = `url('${k.fotoBersama}')`; $("#k_fbT", el).classList.add("has"); } catch (er) { toast(er.message); } };
  $("#k_sg", el).onchange = async (e) => { try { k.ttd = await readImage(e.target.files[0], 500, "image/png"); $("#k_sgT", el).style.backgroundImage = `url('${k.ttd}')`; $("#k_sgT", el).classList.add("has"); } catch (er) { toast(er.message); } };
  if (!isNew) $("#kCancel", el).onclick = () => el.remove();
  $("#kSave", el).onclick = () => {
    k.namaKelas = $("#k_nama", el).value.trim(); k.labelTtd = $("#k_ttd", el).value.trim(); k.waliKelas = $("#k_wali", el).value.trim();
    k.periode = $("#k_periode", el).value.trim(); k.tahun = $("#k_tahun", el).value.trim(); k.sapaan = $("#k_sapaan", el).value; k.templateId = $("#k_tpl", el).value; k.kota = $("#k_kota", el).value.trim(); k.tanggalCetak = $("#k_tgl", el).value;
    k.kegiatan = k.kegiatan.filter((g) => g.nama.trim());
    if (!k.namaKelas) { toast("Isi nama kelas dulu."); $("#k_nama", el).focus(); return; }
    S.kelas = k; queueSave("kelas"); el.remove(); render();
  };
  setTimeout(() => $("#k_nama", el).focus(), 30);
}

/* ================= Mulai ================= */
$("#btnKelas").onclick = () => openKelas(false);
$("#btnTpl").onclick = () => openTemplates();
$("#btnAllAI").onclick = () => runAI(S.students);
$("#btnZip").onclick = downloadZip;
(async () => {
  try { await loadAll(); await loadTemplates(); } catch (e) { toast("Data gagal dimuat: " + (e?.message || e?.code)); }
  S.sel = S.students[0]?.id || null;
  setSaveState(S.mode === "db" ? "Tersimpan" : "");
  render();
})();
window.__app = { S, T, pdfBlob, buildPages, buildPrompt, addStudent, saveTemplate, newTemplate, openEditor, openTemplates, CONTOH_KELAS, CONTOH_SISWA };
</script>
