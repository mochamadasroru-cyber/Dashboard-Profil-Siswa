            <div class="pv-ctrl-head">
              <label for="pcPanX">↔️ Geser Kiri – Kanan (X)</label>
              <span class="badge" id="v_pcPanX">${Math.round(draft.x)}%</span>
            </div>
            <div class="pv-ctrl-row">
              <button type="button" class="btn sm ghost" data-pcstep="x" data-val="-4">◀</button>
              <input type="range" id="pcPanX" min="-120" max="120" step="0.5" value="${draft.x}">
              <button type="button" class="btn sm ghost" data-pcstep="x" data-val="4">▶</button>
            </div>
          </div>

          <!-- Pengaturan Geser Vertikal (Y) -->
          <div class="pv-ctrl">
            <div class="pv-ctrl-head">
              <label for="pcPanY">↕️ Geser Atas – Bawah (Y)</label>
              <span class="badge" id="v_pcPanY">${Math.round(draft.y)}%</span>
            </div>
            <div class="pv-ctrl-row">
              <button type="button" class="btn sm ghost" data-pcstep="y" data-val="-4">▲</button>
              <input type="range" id="pcPanY" min="-120" max="120" step="0.5" value="${draft.y}">
              <button type="button" class="btn sm ghost" data-pcstep="y" data-val="4">▼</button>
            </div>
          </div>

          <!-- Latar Sisa Ruang Frame -->
          <div>
            <div style="font-weight:700;font-size:12px;color:var(--fg-heading);margin-bottom:5px">Latar Sisa Ruang (Saat Mode Muat Utuh / Zoom Out):</div>
            <div style="display:flex;gap:6px">
              <button type="button" class="stu-photo-quick-btn ${draft.bg === "blur" ? "active" : ""}" data-pcbg="blur">✨ Blur Estetik</button>
              <button type="button" class="stu-photo-quick-btn ${draft.bg === "soft" ? "active" : ""}" data-pcbg="soft">🌸 Pastel Lembut</button>
              <button type="button" class="stu-photo-quick-btn ${draft.bg === "white" ? "active" : ""}" data-pcbg="white">⬜ Putih</button>
            </div>
          </div>

          <!-- Edit Manual Teks Keterangan di Bawah Frame Foto ("Pendidikan") -->
          <div style="background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:8px;padding:9px 11px">
            <label for="pcCaption" style="display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12px;color:var(--fg-heading);margin-bottom:5px">
              <span>🏷️ Teks Keterangan di Bawah Frame Foto:</span>
              <span style="font-size:10.5px;color:var(--accent);font-weight:600">Bisa diubah manual</span>
            </label>
            <input type="text" id="pcCaption" value="${esc(draftCaption)}" placeholder="mis. Pendidikan / Kegiatan / Kosongkan jika tanpa label" style="width:100%;padding:7px 10px;font-size:13px;font-weight:600;border-radius:6px;border:1px solid var(--line-strong);background:#fff">
          </div>

          <div style="margin-top:auto;padding-top:6px;display:flex;justify-content:space-between;align-items:center">
            <button type="button" class="btn sm ghost danger" id="pcReset">↺ Reset ke Awal</button>
            <span style="font-size:11px;color:var(--muted)">Tips: Klik 2× pada gambar untuk fokus wajah</span>
          </div>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap">
        <button class="btn ghost danger" id="pcExit" type="button">✕ Keluar</button>
        <div style="display:flex;gap:10px">
          <button class="btn" id="pcCancel" type="button">Batal</button>
          <button class="btn primary" id="pcSave" type="button">✓ Terapkan & Pasang di Frame</button>
        </div>
      </div>
    </div>
  </div>`);

  document.body.append(el);

  const vp = $("#pcViewport", el);
  const cv = $("#pcCanvas", el);
  let isDragging = false;
  let lastMetrics = { fw: 300, fh: 280, boxW: 300, boxH: 280 };

  const syncControls = () => {
    $("#pcZoom", el).value = draft.zoom;
    $("#v_pcZoom", el).textContent = Math.round(draft.zoom * 100) + "%";
    $("#pcPanX", el).value = draft.x;
    $("#v_pcPanX", el).textContent = Math.round(draft.x) + "%";
    $("#pcPanY", el).value = draft.y;
    $("#v_pcPanY", el).textContent = Math.round(draft.y) + "%";
    el.querySelectorAll("[data-pcfit]").forEach((b) => b.classList.toggle("active", b.dataset.pcfit === draft.fit));
    el.querySelectorAll("[data-pcbg]").forEach((b) => b.classList.toggle("active", b.dataset.pcbg === draft.bg));
  };

  const repaint = () => {
    lastMetrics = drawInteractiveFrameCanvas(cv, img, frameMeta, draft, {
      darkBg: true,
      showGhost: true,
      showGrid: isDragging,
      large: true,
      badgeLabel: activeMeta.builtin || frameMeta.shape === "cloud",
      badgeText: draftCaption
    });
  };

  syncControls();
  repaint();

  // Drag-to-pan dengan kursor mouse / sentuhan seperti Canva
  vp.addEventListener("pointerdown", (ev) => {
    if (ev.button !== 0 && ev.pointerType === "mouse") return;
    ev.preventDefault();
    isDragging = true;
    vp.classList.add("dragging");
    vp.setPointerCapture(ev.pointerId);
    const sx = ev.clientX, sy = ev.clientY;
    const ox = draft.x, oy = draft.y;
    const rect = cv.getBoundingClientRect();
    const scaleX = cv.width / Math.max(1, rect.width);
    const scaleY = cv.height / Math.max(1, rect.height);
    repaint();

    const onMove = (mv) => {
      const dxCanvas = (mv.clientX - sx) * scaleX;
      const dyCanvas = (mv.clientY - sy) * scaleY;
      draft.x = Math.max(-160, Math.min(160, Math.round((ox + (dxCanvas / Math.max(1, lastMetrics.boxW)) * 100) * 2) / 2));
      draft.y = Math.max(-160, Math.min(160, Math.round((oy + (dyCanvas / Math.max(1, lastMetrics.boxH)) * 100) * 2) / 2));
      syncControls();
      repaint();
    };
    const onUp = () => {
      isDragging = false;
      vp.classList.remove("dragging");
      vp.removeEventListener("pointermove", onMove);
      vp.removeEventListener("pointerup", onUp);
      vp.removeEventListener("pointercancel", onUp);
      repaint();
    };
    vp.addEventListener("pointermove", onMove);
    vp.addEventListener("pointerup", onUp);
    vp.addEventListener("pointercancel", onUp);
  });

  // Scroll wheel untuk zoom seperti Canva
  vp.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const delta = ev.deltaY < 0 ? 0.08 : -0.08;
    draft.zoom = Math.max(0.35, Math.min(3.0, Math.round((draft.zoom + delta) * 100) / 100));
    syncControls();
    repaint();
  }, { passive: false });

  // Double-click untuk otomatis fokus wajah (potret) atau tengah
  vp.addEventListener("dblclick", () => {
    const smart = computeSmartPortraitOffset(img, frameMeta.w || 53.2, frameMeta.h || 49.8, draft.rot);
    if (Math.abs(draft.y - smart.y) > 2 || draft.x !== 0) {
      draft.x = 0;
      draft.y = smart.y;
      draft.fit = "cover";
    } else {
      draft.x = 0;
      draft.y = 0;
    }
    syncControls();
    repaint();
  });

  // Tombol Mode Fit (Cover vs Contain)
  el.querySelectorAll("[data-pcfit]").forEach((btn) => {
    btn.onclick = () => {
      draft.fit = btn.dataset.pcfit;
      draft.x = 0;
      draft.y = draft.fit === "cover" ? computeSmartPortraitOffset(img, frameMeta.w || 53.2, frameMeta.h || 49.8, draft.rot).y : 0;
      draft.zoom = 1;
      syncControls();
      repaint();
    };
  });

  // Tombol Latar Belakang
  el.querySelectorAll("[data-pcbg]").forEach((btn) => {
    btn.onclick = () => {
      draft.bg = btn.dataset.pcbg;
      syncControls();
      repaint();
    };
  });

  // Preset Cepat
  $("#pcPresetFace", el).onclick = () => {
    const smart = computeSmartPortraitOffset(img, frameMeta.w || 53.2, frameMeta.h || 49.8, draft.rot);
    draft.fit = "cover";
    draft.x = 0;
    draft.y = smart.y || 24;
    draft.zoom = Math.max(1, draft.zoom);
    syncControls();
    repaint();
  };
  $("#pcPresetCenter", el).onclick = () => {
    draft.x = 0;
    draft.y = 0;
    syncControls();
    repaint();
  };
  $("#pcPresetBottom", el).onclick = () => {
    const smart = computeSmartPortraitOffset(img, frameMeta.w || 53.2, frameMeta.h || 49.8, draft.rot);
    draft.fit = "cover";
    draft.x = 0;
    draft.y = -(smart.y || 24);
    syncControls();
    repaint();
  };
  $("#pcRotate90", el).onclick = () => {
    draft.rot = ((draft.rot || 0) + 90) % 360;
    draft.x = 0;
    draft.y = 0;
    syncControls();
    repaint();
  };

  // Sliders
  $("#pcZoom", el).oninput = (e) => { draft.zoom = parseFloat(e.target.value); syncControls(); repaint(); };
  $("#pcPanX", el).oninput = (e) => { draft.x = parseFloat(e.target.value); syncControls(); repaint(); };
  $("#pcPanY", el).oninput = (e) => { draft.y = parseFloat(e.target.value); syncControls(); repaint(); };

  el.querySelectorAll("[data-pcstep]").forEach((btn) => {
    btn.onclick = () => {
      const k = btn.dataset.pcstep;
      const step = parseFloat(btn.dataset.val);
      if (k === "zoom") draft.zoom = Math.max(0.35, Math.min(3.0, Math.round((draft.zoom + step) * 100) / 100));
      if (k === "x") draft.x = Math.max(-160, Math.min(160, Math.round((draft.x + step) * 2) / 2));
      if (k === "y") draft.y = Math.max(-160, Math.min(160, Math.round((draft.y + step) * 2) / 2));
      syncControls();
      repaint();
    };
  });

  const pcCapInp = $("#pcCaption", el);
  if (pcCapInp) {
    pcCapInp.oninput = (e) => {
      draftCaption = e.target.value;
      repaint();
    };
  }

  $("#pcReset", el).onclick = () => {
    draft.x = 0; draft.y = 0; draft.zoom = 1; draft.fit = "cover"; draft.bg = "blur"; draft.rot = 0;
    syncControls();
    repaint();
  };

  const closeCancel = () => { el.remove(); };
  $("#pcCancelTop", el).onclick = closeCancel;
  $("#pcExitTop", el).onclick = closeCancel;
  $("#pcCancel", el).onclick = closeCancel;
  $("#pcExit", el).onclick = closeCancel;

  $("#pcSave", el).onclick = () => {
    setPhotoCfg(s, normKey, draft);
    setPhotoCaption(s, normKey, draftCaption);
    touch(s);
    el.remove();
    toast("✅ Posisi foto & teks keterangan di bawah frame berhasil disimpan!");
    if (typeof onDone === "function") onDone();
  };
}

                <button type="button" class="stu-photo-quick-btn ${pCfg.fit === "cover" ? "active" : ""}" data-qfit="cover" data-qkey="${pKey}" title="Isi penuh mengikuti bentuk frame (bisa digeser)">🖼️ Isi Penuh</button>
                <button type="button" class="stu-photo-quick-btn ${pCfg.fit === "contain" ? "active" : ""}" data-qfit="contain" data-qkey="${pKey}" title="Muat seluruh foto potret secara utuh tanpa ada yang terpotong">📐 Muat Utuh Potret</button>
                <button type="button" class="stu-photo-quick-btn" data-qface="${pKey}" title="Otomatis pas-kan fokus ke wajah/kepala bagian atas untuk foto potret">👤 Fokus Wajah</button>
                <button type="button" class="stu-photo-quick-btn" data-qrot="${pKey}" title="Putar foto 90 derajat">🔄</button>
              </div>
              <div class="stu-photo-quick-row" style="gap:6px">
                <span style="font-size:11px;font-weight:700;color:var(--muted)">🔍</span>
                <input type="range" min="0.4" max="2.8" step="0.02" value="${pCfg.zoom}" data-qzoom="${pKey}" style="flex:1;height:5px" aria-label="Zoom ${slot.label}">
                <span class="badge" data-qzoomlbl="${pKey}" style="font-size:10.5px;min-width:38px;text-align:center">${Math.round(pCfg.zoom * 100)}%</span>
                <button type="button" class="stu-photo-quick-btn" data-qreset="${pKey}" title="Reset posisi foto ke tengah" style="flex:0">↺</button>
              </div>
            </div>` : ""}

            <div class="meta" style="display:flex;flex-direction:column;gap:6px;margin-top:auto">
              ${pVal ? `<button class="btn sm primary" data-opencanvacrop="${pKey}" type="button" style="width:100%;justify-content:center">✋ Geser & Pas-kan di Mode Canva (Layar Lebar)</button>` : ""}
              <span style="display:flex;gap:6px;width:100%">
                <span class="btn sm ${pVal ? "" : "primary"} file-btn" style="flex:1;text-align:center;justify-content:center">${pVal ? "Ganti Foto" : "Pilih / Upload Foto"}<input type="file" accept="image/*" data-photo="${pKey}" aria-label="Upload ${slot.label}"></span>
                ${pVal ? `<button class="btn sm ghost danger" data-clear="${pKey}" type="button">Hapus</button>` : ""}
              </span>
            </div>
          </div>`;
        }).join("")}
      </div>
      ${activeMeta.builtin ? `
      <div class="fields" style="padding:12px 0 0;margin-top:12px;border-top:1px dashed var(--line)">
        <div class="f"><label for="f_lblFoto1">🏷️ Keterangan Kapsul di Bawah Frame Foto 1 (Awan Kiri)</label><input type="text" id="f_lblFoto1" value="${esc(getPhotoCaption(s, "foto1"))}" placeholder="mis. Pendidikan / Kegiatan / Kosongkan jika tanpa teks"></div>
        <div class="f"><label for="f_lblFoto2">🏷️ Keterangan Kapsul di Bawah Frame Foto 2 (Awan Kanan)</label><input type="text" id="f_lblFoto2" value="${esc(getPhotoCaption(s, "foto2"))}" placeholder="mis. Pendidikan / Kegiatan / Kosongkan jika tanpa teks"></div>
      </div>` : ""}
    </div>`}

    ${SECTIONS.map((sec, idx) => `<div class="sec"><h3><span class="sec-num">${idx + 3}</span><span>${esc(sec.title)}</span></h3><div class="fields">${
      sec.id === "keagamaan"
        ? `${sec.fields.filter((f) => f.type === "versi_keagamaan" || f.type === "kegiatan_keagamaan" || f.k === "capaianTahfiz").map((f) => fieldHtml(f, inp)).join("")}<div class="rate-grid">${sec.fields.filter((f) => f.type === "rate").map((f) => fieldHtml(f, inp)).join("")}</div>${sec.fields.filter((f) => f.type !== "rate" && f.type !== "versi_keagamaan" && f.type !== "kegiatan_keagamaan" && f.k !== "capaianTahfiz").map((f) => fieldHtml(f, inp)).join("")}`
        : sec.id === "kedisiplinan"
        ? `<div class="rate-grid">${sec.fields.filter((f) => f.type === "num").map((f) => fieldHtml(f, inp)).join("")}</div>${sec.fields.filter((f) => f.type !== "num").map((f) => fieldHtml(f, inp)).join("")}`
        : sec.fields.map((f) => fieldHtml(f, inp)).join("")}</div></div>`).join("")}
    <div class="footer-banner">
      <div class="footer-banner-text">
        Profil siswa <span class="hl-oren">bukan hanya</span> kumpulan catatan harian, tetapi rangkuman utuh perkembangan ibadah, akhlak, dan akademik untuk mendampingi tumbuh kembang ananda.
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn danger" id="delStu" style="background:rgba(255,255,255,0.1);color:#fecaca;border-color:rgba(254,202,202,0.3)">Hapus siswa ini</button>
        <button class="btn primary" id="toPara" style="background:var(--orange-gradient);box-shadow:var(--shadow-orange)">✨ Susun Narasi Laporan Siswa →</button>
      </div>
    </div></div>`));

  // Inisialisasi kanvas interaktif di setiap kartu foto siswa (bisa langsung digeser dengan mouse!)
  const stagePainters = {};
  PHOTO_SLOTS.forEach((slot, i) => {
    const pKey = slot.key;
    const stageEl = $(`[data-stagelayer="${pKey}"]`, body);
    const cv = $(`[data-stagecv="${pKey}"]`, body);
    if (!stageEl || !cv) return;
    const frameMeta = frames[i] || frames[0] || { shape: "cloud", w: 53.2, h: 49.8, border: "#a27e8a" };
    let cachedImg = null;
    let isDraggingCard = false;
    let lastMetrics = { boxW: 260, boxH: 240 };

    const paintCardStage = async () => {
      const pVal = getStudentPhoto(s, pKey);
      if (pVal && !cachedImg) cachedImg = await loadImg(pVal);
      if (!pVal) cachedImg = null;
      const badgeText = getPhotoCaption(s, pKey);
      lastMetrics = drawInteractiveFrameCanvas(cv, cachedImg, frameMeta, getPhotoCfg(s, pKey), {
        darkBg: false,
        showGhost: isDraggingCard,
        showGrid: isDraggingCard,
        badgeLabel: (activeMeta.builtin && i < 2) || frameMeta?.shape === "cloud",
        badgeText
      });
    };
    stagePainters[pKey] = paintCardStage;
    paintCardStage();

    // Klik & seret langsung pada kartu foto dengan kursor mouse
    stageEl.addEventListener("pointerdown", (ev) => {
      if (!getStudentPhoto(s, pKey)) return;
      if (ev.button !== 0 && ev.pointerType === "mouse") return;
      ev.preventDefault();
      isDraggingCard = true;
      stageEl.classList.add("dragging");
      stageEl.setPointerCapture(ev.pointerId);
      const sx = ev.clientX, sy = ev.clientY;
      const curCfg = getPhotoCfg(s, pKey);
      const ox = curCfg.x, oy = curCfg.y;
      const rect = cv.getBoundingClientRect();
      const scaleX = cv.width / Math.max(1, rect.width);
      const scaleY = cv.height / Math.max(1, rect.height);
      paintCardStage();

      const onMove = (mv) => {
        const dxCanvas = (mv.clientX - sx) * scaleX;
        const dyCanvas = (mv.clientY - sy) * scaleY;
        const nx = Math.max(-160, Math.min(160, Math.round((ox + (dxCanvas / Math.max(1, lastMetrics.boxW)) * 100) * 2) / 2));
        const ny = Math.max(-160, Math.min(160, Math.round((oy + (dyCanvas / Math.max(1, lastMetrics.boxH)) * 100) * 2) / 2));
        setPhotoCfg(s, pKey, { x: nx, y: ny });
        paintCardStage();
      };
      const onUp = () => {
        isDraggingCard = false;
        stageEl.classList.remove("dragging");
        stageEl.removeEventListener("pointermove", onMove);
        stageEl.removeEventListener("pointerup", onUp);
        stageEl.removeEventListener("pointercancel", onUp);
        touch(s);
        paintCardStage();
      };
      stageEl.addEventListener("pointermove", onMove);
      stageEl.addEventListener("pointerup", onUp);
      stageEl.addEventListener("pointercancel", onUp);
    });

    // Scroll wheel zoom langsung pada kartu foto
    stageEl.addEventListener("wheel", (ev) => {
      if (!getStudentPhoto(s, pKey)) return;
      ev.preventDefault();
      const curCfg = getPhotoCfg(s, pKey);
      const delta = ev.deltaY < 0 ? 0.08 : -0.08;
      const newZoom = Math.max(0.4, Math.min(2.8, Math.round((curCfg.zoom + delta) * 100) / 100));
      setPhotoCfg(s, pKey, { zoom: newZoom });
      const zSlider = $(`[data-qzoom="${pKey}"]`, body);
      const zLbl = $(`[data-qzoomlbl="${pKey}"]`, body);
      if (zSlider) zSlider.value = newZoom;
      if (zLbl) zLbl.textContent = Math.round(newZoom * 100) + "%";
      touch(s);
      paintCardStage();
    }, { passive: false });

    // Double click kartu foto -> buka Mode Canva layar lebar
    stageEl.addEventListener("dblclick", () => {
      if (!getStudentPhoto(s, pKey)) return;
      openPhotoCropperModal(s, pKey, () => renderForm(body, s));
    });
  });

  // Handler tombol-tombol cepat di bawah kartu foto
  body.querySelectorAll("[data-opencanvacrop]").forEach((btn) => {
    btn.onclick = () => openPhotoCropperModal(s, btn.dataset.opencanvacrop, () => renderForm(body, s));
  });
  body.querySelectorAll("[data-qfit]").forEach((btn) => {
    btn.onclick = async () => {
      const k = btn.dataset.qkey;
      const fit = btn.dataset.qfit;
      const img = await loadImg(getStudentPhoto(s, k));
      const idx = k === "foto1" ? 0 : k === "foto2" ? 1 : 2;
      const fm = frames[idx] || frames[0] || { w: 53.2, h: 49.8 };
      const curCfg = getPhotoCfg(s, k);
      const smart = fit === "cover" ? computeSmartPortraitOffset(img, fm.w, fm.h, curCfg.rot) : { x: 0, y: 0 };
      setPhotoCfg(s, k, { fit, x: 0, y: smart.y || 0, zoom: 1 });
      touch(s);
      renderForm(body, s);
    };
  });
  body.querySelectorAll("[data-qface]").forEach((btn) => {
    btn.onclick = async () => {
      const k = btn.dataset.qface;
      const img = await loadImg(getStudentPhoto(s, k));
      const idx = k === "foto1" ? 0 : k === "foto2" ? 1 : 2;
      const fm = frames[idx] || frames[0] || { w: 53.2, h: 49.8 };
      const curCfg = getPhotoCfg(s, k);
      const smart = computeSmartPortraitOffset(img, fm.w, fm.h, curCfg.rot);
      setPhotoCfg(s, k, { fit: "cover", x: 0, y: smart.y || 24, zoom: Math.max(1, curCfg.zoom) });
      touch(s);
      stagePainters[k]?.();
      toast("👤 Fokus foto diarahkan ke bagian atas/wajah.");
    };
  });
  body.querySelectorAll("[data-qrot]").forEach((btn) => {
    btn.onclick = () => {
      const k = btn.dataset.qrot;
      const curCfg = getPhotoCfg(s, k);
      setPhotoCfg(s, k, { rot: ((curCfg.rot || 0) + 90) % 360, x: 0, y: 0 });
      touch(s);
      stagePainters[k]?.();
    };
  });
  body.querySelectorAll("[data-qzoom]").forEach((inp) => {
    inp.oninput = () => {
      const k = inp.dataset.qzoom;
      const z = parseFloat(inp.value);
      setPhotoCfg(s, pKeyFromAttr(k), { zoom: z });
      const zLbl = $(`[data-qzoomlbl="${k}"]`, body);
      if (zLbl) zLbl.textContent = Math.round(z * 100) + "%";
      touch(s);
      stagePainters[k]?.();
    };
  });
  function pKeyFromAttr(k) { return k; }
  body.querySelectorAll("[data-qreset]").forEach((btn) => {
    btn.onclick = () => {
      const k = btn.dataset.qreset;
      setPhotoCfg(s, k, { x: 0, y: 0, zoom: 1, fit: "cover", bg: "blur", rot: 0 });
      touch(s);
      renderForm(body, s);
      toast("Posisi foto direset.");
    };
  });

  $("#f_nama").oninput = (e) => { s.nama = e.target.value; delete s.contoh; $("#wName").textContent = s.nama || "Siswa baru"; touch(s); };
  $("#f_panggilan").oninput = (e) => { s.panggilan = e.target.value; delete s.contoh; touch(s); };
  const btnClearName = $("#btnClearStuName", body);
  if (btnClearName) {
    btnClearName.onclick = () => {
      s.nama = "";
      s.panggilan = "";
      delete s.contoh;
      $("#f_nama", body).value = "";
      $("#f_panggilan", body).value = "";
      $("#wName").textContent = "Siswa baru";
      touch(s);
      $("#f_nama", body).focus();
      toast("🧹 Nama siswa dikosongkan. Silakan ketik nama siswa baru.");
    };
  }
  const btnQuickDelTop = $("#btnQuickDelStuTop", body);
  if (btnQuickDelTop) {
    btnQuickDelTop.onclick = () => {
      if (btnQuickDelTop.dataset.armed) {
        const nm = s.nama || "Siswa baru";
        deleteStudentsByIds([s.id]);
        toast(`🗑️ Data siswa "${nm}" telah dihapus.`);
        return;
      }
      btnQuickDelTop.dataset.armed = "1";
      btnQuickDelTop.textContent = "⚠️ Klik Lagi utk Hapus";
      setTimeout(() => {
        if (btnQuickDelTop.isConnected) {
          delete btnQuickDelTop.dataset.armed;
          btnQuickDelTop.textContent = "🗑️ Hapus Siswa Ini";
        }
      }, 3500);
    };
  }
  const btnOpenDelMenu = $("#btnOpenDelMenuFromForm", body);
  if (btnOpenDelMenu) {
    btnOpenDelMenu.onclick = () => openDeleteStudentsModal(s.id);
  }
  body.querySelectorAll("[data-photocaption]").forEach((inpEl) => {
    inpEl.oninput = (e) => {
      const pk = inpEl.dataset.photocaption;
      const val = e.target.value;
      setPhotoCaption(s, pk, val);
      if (pk === "foto1" && $("#f_lblFoto1", body)) $("#f_lblFoto1", body).value = val;
      if (pk === "foto2" && $("#f_lblFoto2", body)) $("#f_lblFoto2", body).value = val;
      touch(s);
      stagePainters[pk]?.();
    };
  });
  const fLbl1 = $("#f_lblFoto1", body);
  if (fLbl1) fLbl1.oninput = (e) => {
    const val = e.target.value;
    setPhotoCaption(s, "foto1", val);
    const cardInp = $(`[data-photocaption="foto1"]`, body);
    if (cardInp) cardInp.value = val;
    touch(s);
    stagePainters.foto1?.();
  };
  const fLbl2 = $("#f_lblFoto2", body);
  if (fLbl2) fLbl2.oninput = (e) => {
    const val = e.target.value;
    setPhotoCaption(s, "foto2", val);
    const cardInp = $(`[data-photocaption="foto2"]`, body);
    if (cardInp) cardInp.value = val;
    touch(s);
    stagePainters.foto2?.();
  };
  body.querySelectorAll("[data-k]").forEach((el) => {
    const ev = el.tagName === "SELECT" ? "change" : "input";
    el.addEventListener(ev, () => { inp[el.dataset.k] = el.value; touch(s); });
  });
  body.querySelectorAll("[data-keg]").forEach((el) => el.onchange = () => {
    const set = new Set(inp.kegiatanSkip || []); el.checked ? set.delete(el.dataset.keg) : set.add(el.dataset.keg);
    inp.kegiatanSkip = [...set]; touch(s);
  });
  body.querySelectorAll("[data-delkeg]").forEach((btn) => btn.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    const id = btn.dataset.delkeg;
    if (!S.kelas) return;
    S.kelas.kegiatan = (S.kelas.kegiatan || []).filter((g) => g.id !== id);
    queueSave("kelas");
    renderForm(body, s);
    toast("Kegiatan bulan ini dihapus.");
  });
  const btnAddKegInline = $("#btnAddKegInline", body);
  if (btnAddKegInline) {
    btnAddKegInline.onclick = () => {
      const nama = ($("#newKegNama", body)?.value || "").trim();
      const tanggal = ($("#newKegTgl", body)?.value || "").trim();
      if (!nama) { toast("Isi nama kegiatan terlebih dahulu."); $("#newKegNama", body)?.focus(); return; }
      S.kelas.kegiatan = S.kelas.kegiatan || [];
      S.kelas.kegiatan.push({ id: "k" + rid(), nama, tanggal });
      queueSave("kelas");
      renderForm(body, s);
      toast(`✅ Kegiatan "${nama}" ditambahkan ke bulan ini!`);
    };
  }
  body.querySelectorAll("[data-kegagama]").forEach((el) => el.onchange = () => {
    const set = new Set(inp.kegiatanKeagamaanSkip || []); el.checked ? set.delete(el.dataset.kegagama) : set.add(el.dataset.kegagama);
    inp.kegiatanKeagamaanSkip = [...set]; touch(s);
  });
  body.querySelectorAll("[data-delkegagama]").forEach((btn) => btn.onclick = (e) => {
    e.preventDefault(); e.stopPropagation();
    const id = btn.dataset.delkegagama;
    if (!S.kelas) return;
    S.kelas.kegiatanKeagamaan = (S.kelas.kegiatanKeagamaan || []).filter((g) => g.id !== id);
    queueSave("kelas");
    renderForm(body, s);
    toast("Kegiatan keagamaan bulan ini dihapus.");
  });
  const btnAddKegAgamaInline = $("#btnAddKegAgamaInline", body);
  if (btnAddKegAgamaInline) {
    btnAddKegAgamaInline.onclick = () => {
      const nama = ($("#newKegAgamaNama", body)?.value || "").trim();
      const tanggal = ($("#newKegAgamaTgl", body)?.value || "").trim();
      if (!nama) { toast("Isi nama kegiatan keagamaan terlebih dahulu."); $("#newKegAgamaNama", body)?.focus(); return; }
      S.kelas.kegiatanKeagamaan = S.kelas.kegiatanKeagamaan || [];
      S.kelas.kegiatanKeagamaan.push({ id: "ka" + rid(), nama, tanggal });
      queueSave("kelas");
      renderForm(body, s);
      toast(`✅ Kegiatan keagamaan "${nama}" ditambahkan!`);
    };
  }
  body.querySelectorAll("[data-photo]").forEach((el) => el.onchange = async () => {
    const file = el.files?.[0]; if (!file) return;
    try {
      const k = el.dataset.photo;
      const imgData = await readImage(file, 1200);
      setStudentPhoto(s, k, imgData);
      const uploadedImg = await loadImg(imgData);
      const idx = k === "foto1" ? 0 : k === "foto2" ? 1 : 2;
      const fm = frames[idx] || frames[0] || { w: 53.2, h: 49.8 };
      const smartCfg = computeSmartPortraitOffset(uploadedImg, fm.w, fm.h, 0);
      setPhotoCfg(s, k, smartCfg);
      touch(s);
      renderForm(body, s);
      // Buka otomatis editor geser foto gaya Canva agar guru bisa langsung memaskan foto di frame
      openPhotoCropperModal(s, k, () => renderForm(body, s));
    } catch (e) { toast(e.message); }
  });
  body.querySelectorAll("[data-clear]").forEach((el) => el.onclick = () => {
    const k = el.dataset.clear;
    setStudentPhoto(s, k, "");
    setPhotoCfg(s, k, { x: 0, y: 0, zoom: 1, fit: "cover", bg: "blur", rot: 0 });
    touch(s);
    renderForm(body, s);
  });
  const btnGoFrames = $("#btnGoToFramesTab", body);
  if (btnGoFrames) btnGoFrames.onclick = () => {
    S.tab = "pratinjau";
    pvShowFrames = true;
    renderWork();
  };
  $("#toPara").onclick = () => runAI([s]);
  const del = $("#delStu");
  del.onclick = () => {
    if (del.dataset.armed) { S.students = S.students.filter((x) => x.id !== s.id); S.sel = S.students[0]?.id || null; queueSave(s.id); render(); toast("Siswa dihapus."); return; }
    del.dataset.armed = "1"; del.textContent = "Klik lagi untuk menghapus"; setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = "Hapus siswa ini"; } }, 4000);
  };
}

/* ================= Tab: Paragraf ================= */
function srcHtml(s, secId) {
  const sec = SECTIONS.find((x) => x.id === secId), inp = s.input || {};
  if (!sec) return "";
  const rows = [];
  for (const f of sec.fields) {
    if (f.type === "kegiatan") {
      const skip = new Set(inp.kegiatanSkip || []);
      const ikut = (S.kelas.kegiatan || []).filter((g) => !skip.has(g.id)).map((g) => g.tanggal ? `${g.nama} (${g.tanggal})` : g.nama);
      if (ikut.length) rows.push([f.label, ikut.join(", ")]); continue;
    }
    if (f.type === "kegiatan_keagamaan") {
      const skip = new Set(inp.kegiatanKeagamaanSkip || []);
      const ikut = (S.kelas.kegiatanKeagamaan || []).filter((g) => !skip.has(g.id)).map((g) => g.tanggal ? `${g.nama} (${g.tanggal})` : g.nama);
      if (ikut.length) rows.push([f.label, ikut.join(", ")]); continue;
    }
    if (f.type === "versi_keagamaan") {
      const opt = VERSI_KEAGAMAAN_OPTS.find((o) => o.v === (inp[f.k] || "tertib"));
      if (opt) rows.push([f.label, opt.l]); continue;
    }
    if (String(inp[f.k] ?? "").trim()) rows.push([f.label, f.type === "num" ? `${inp[f.k]} kali` : inp[f.k]]);
  }
  if (secId === "kesimpulan") { if (inp.kelebihan) rows.push(["Kelebihan", inp.kelebihan]); }
  return rows.length ? `<dl>${rows.map(([a, b]) => `<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join("")}</dl>` : `<span>Tidak ada data guru untuk bagian ini.</span>`;
}
function renderParas(body, s) {
  const f = s.final || (s.final = {});
  const warns = warningsFor(s);
  const total = PARA_SECTIONS.reduce((n, p) => n + (f[p.id] || []).length, 0);
  body.replaceChildren(h(`<div>
    <div class="para-hero-bar" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;background:var(--surface-2);border:1.5px solid var(--accent);border-radius:var(--r);padding:14px 16px;margin-bottom:16px">
      <div>
        <div style="font-weight:700;font-size:14px;color:var(--fg-heading);display:flex;align-items:center;gap:6px">
          <span>✍️ Narasi Kalimat Laporan Perkembangan Siswa</span>
          <span class="chip" style="font-size:11px;background:var(--accent-soft);color:var(--accent);font-weight:700">Bahasa Indonesia Baku & Santun</span>
        </div>
        <div style="font-size:12px;color:var(--muted);margin-top:3px">
          ${total ? `<b>${total} paragraf</b> tersusun · Mengikuti kaidah bahasa baku, santun, dan pedagogis. Anda dapat langsung mengedit kalimat di bawah.` : `Belum ada narasi tersusun. Klik tombol di kanan untuk menyusun narasi kalimat laporan secara otomatis dan rapi.`}
        </div>

async function autoFitLayout(s) {
  const tpl = await resolveTpl(activeTplMeta());
  const stage = document.createElement("div"); stage.style.cssText = "position:fixed;left:0;top:0;z-index:-10;pointer-events:none;opacity:0;";
  document.body.append(stage);

  try {
    const pages = await buildPages(s, stage, tpl);
    const currentCount = pages.length;
    if (currentCount <= 1) {
      toast("Dokumen sudah muat dalam 1 halaman.");
      return;
    }

    const targetCount = currentCount - 1;
    const currentBody = { ...DEFAULT_BODY, ...(tpl.body || {}), ...(s.layout?.body || {}) };
    let bestSize = currentBody.sizePt;
    let bestGap = currentBody.gapMm;
    let success = false;

    for (let sz = currentBody.sizePt - 0.2; sz >= 8.0; sz -= 0.2) {
      for (let gp = currentBody.gapMm; gp >= Math.max(1.5, currentBody.gapMm - 1.5); gp -= 0.3) {
        const testLayout = {
          ...(s.layout || {}),
          body: { ...currentBody, sizePt: Math.round(sz * 10) / 10, gapMm: Math.round(gp * 10) / 10 }
        };
        const testStu = { ...s, layout: testLayout };
        const testPages = await buildPages(testStu, stage, tpl);
        if (testPages.length <= targetCount) {
          bestSize = Math.round(sz * 10) / 10;
          bestGap = Math.round(gp * 10) / 10;
          success = true;
          break;
        }
      }
      if (success) break;
    }

    if (success) {
      s.layout = s.layout || {};
      s.layout.body = { ...currentBody, sizePt: bestSize, gapMm: bestGap };
      touch(s);
      const body = $("#tabBody");
      if (body) renderPreview(body, s);
      toast(`✨ Berhasil! Font disesuaikan ke ${bestSize}pt agar pas ${targetCount} halaman.`);
    } else {
      toast("Teks terlalu panjang untuk dipas-kan otomatis. Coba kurangi sedikit kalimat di tab Paragraf atau tinggikan area teks.");
    }
  } catch (e) {
    toast("Auto-fit gagal: " + (e.message || e));
  } finally {
    stage.remove();
  }
}

          const hitBox = h(`<div class="${pvShowFrames ? "pv-frame-guide-box" : ""}" style="position:absolute;left:${fx}px;top:${fy}px;width:${fw}px;height:${fh}px;border-radius:${radius};pointer-events:auto;cursor:grab;z-index:16" title="✋ Klik & seret kursor mouse untuk menggeser isi foto di dalam frame · Scroll untuk zoom · Klik 2× untuk buka Mode Canva">

            const onUp = () => {

  });

/* ================= Aksi: AI, unduh ================= */
function progressDialog(title) {
  const ctl = new AbortController();
  const el = h(`<div class="overlay" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dialog">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
      <h3 style="margin:0">${esc(title)}</h3>
      <button class="btn sm ghost danger" id="pgExitTop" type="button">✕ Keluar</button>
    </div>
    <p id="pgText">Menyiapkan…</p><div class="bar"><div id="pgBar"></div></div>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button class="btn" id="pgStop" type="button">Batal</button>
      <button class="btn ghost danger" id="pgExit" type="button">✕ Keluar</button>
    </div></div></div>`);
  document.body.append(el);
  const stopAndClose = () => { ctl.abort(); el.remove(); };
  $("#pgStop", el).onclick = stopAndClose;
  $("#pgExit", el).onclick = stopAndClose;
  $("#pgExitTop", el).onclick = stopAndClose;
  return { signal: ctl.signal, set(t, frac) { $("#pgText", el).textContent = t; if (frac != null) $("#pgBar", el).style.width = Math.round(frac * 100) + "%"; }, close() { el.remove(); } };
}
async function runAI(list) {
  const todo = list.filter((s) => statusOf(s) !== "kosong");
  if (!todo.length) return toast("Isi data siswa dulu sebelum menyusun narasi paragraf.");
  const dlg = progressDialog(todo.length > 1 ? "Menyusun narasi laporan seluruh kelas" : "Menyusun narasi laporan");
  let done = 0;
  try {
    for (const s of todo) {
      if (dlg.signal.aborted) break;
      dlg.set(`${s.nama || "Siswa"}: Menyusun narasi bahasa Indonesia yang santun & baku…`, done / todo.length);
      s.final = await generateFor(s, dlg.signal);
      done++; touch(s);
    }
    dlg.close();
    toast(done ? `✅ Narasi laporan berhasil disusun untuk ${done} siswa!` : "Dihentikan.");
  } catch (e) {
    dlg.close();
    const m = { cancelled: "Dihentikan.", not_granted: "Izin AI ditolak.", rate_limited: "Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.", invalid_json: "Jawaban AI tidak terbaca. Coba lagi." };
    toast((done ? `${done} siswa selesai. ` : "") + (m[e?.code] || "Gagal menyusun narasi: " + (e?.message || e?.code || "coba lagi")), 5000);
  }
  if (cur() && todo.includes(cur())) S.tab = "paragraf";
  renderList(); renderWork();
}
async function downloadOne(s) {
  if (statusOf(s) !== "siap") toast("Paragraf belum diisi, PDF hanya berisi pembuka dan penutup.");
  const dlg = progressDialog("Membuat PDF");
  try { dlg.set(`Menyusun ${s.nama || "profil"}…`, .3); const blob = await pdfBlob(s); dlg.close(); await saveFile(pdfName(s), blob); }
  catch (e) { dlg.close(); toast("PDF gagal dibuat: " + (e.message || e)); }
}
async function downloadZip() {
  const list = S.students.filter((s) => statusOf(s) === "siap");
  if (!list.length) return toast("Belum ada siswa yang siap cetak.");
  const dlg = progressDialog("Membuat PDF satu kelas");
  try {
    const zip = new JSZip();
    for (let i = 0; i < list.length; i++) {
      if (dlg.signal.aborted) { dlg.close(); return toast("Dihentikan."); }
      dlg.set(`${i + 1}/${list.length} · ${list[i].nama}`, i / list.length);
      zip.file(pdfName(list[i]), await pdfBlob(list[i]));
    }
    dlg.set("Mengemas ZIP…", 1);
    const blob = await zip.generateAsync({ type: "blob" });
    dlg.close();
    await saveFile(`Profil_${(S.kelas.namaKelas || "Kelas").replace(/[^\p{L}\p{N}]+/gu, "_")}_${(S.kelas.periode || "").replace(/[^\p{L}\p{N}]+/gu, "_")}.zip`, blob);
  } catch (e) { dlg.close(); toast("Gagal membuat ZIP: " + (e.message || e)); }
}

      <div class="f"><label for="k_kota">Kota</label><input type="text" id="k_kota" value="${esc(k.kota)}"></div>
      <div class="f"><label for="k_tgl">Tanggal cetak</label><input type="date" id="k_tgl" value="${esc(k.tanggalCetak)}"></div>
      <div class="f"><label for="k_lblFoto1">🏷️ Default Keterangan Bawah Frame Foto 1</label><input type="text" id="k_lblFoto1" value="${esc(k.labelFoto1 !== undefined ? k.labelFoto1 : "Pendidikan")}" placeholder="mis. Pendidikan / Kegiatan"><span class="hint">Teks default kapsul di bawah foto kiri (bisa diubah manual per siswa).</span></div>
      <div class="f"><label for="k_lblFoto2">🏷️ Default Keterangan Bawah Frame Foto 2</label><input type="text" id="k_lblFoto2" value="${esc(k.labelFoto2 !== undefined ? k.labelFoto2 : "Pendidikan")}" placeholder="mis. Pendidikan / Kegiatan"><span class="hint">Teks default kapsul di bawah foto kanan (bisa diubah manual per siswa).</span></div>
      <div class="photo-row" style="grid-template-columns:1fr">
        <div class="photo"><div class="thumb ${k.ttd ? "has" : ""}" id="k_sgT" style="background-size:contain;${k.ttd ? `background-image:url('${k.ttd}')` : ""}"></div><div class="meta"><span>Tanda tangan wali kelas</span><span class="btn sm file-btn">Pilih gambar<input type="file" accept="image/png,image/*" id="k_sg"></span><span class="hint">PNG latar transparan paling rapi</span></div></div>
      </div>
      <div class="f wide">
        <span class="lbl">📅 Kegiatan Umum Sekolah Bulan Ini (Non-Akademik)</span>
        <span class="hint" style="margin-bottom:6px">Daftar kegiatan sekolah bulan ini (mis. AEP, Debat OSIS, Outing Class). Setiap bulan dapat diubah sesuai kegiatan yang berlangsung.</span>
        <div id="kegList" style="display:flex;flex-direction:column;gap:6px"></div>
        <div style="margin-top:6px"><button class="btn sm" id="kegAdd" type="button">+ Tambah Kegiatan Umum Bulan Ini</button></div>
      </div>
      <div class="f wide">
        <span class="lbl">🕌 Kegiatan Keagamaan Bulan Ini (Aspek Keagamaan & Pembinaan Karakter)</span>
        <span class="hint" style="margin-bottom:6px">Contoh: "buka puasa bersama" (tanggal: "17 September"). Otomatis disusun menjadi kalimat: <i>"Pada aspek keagamaan dan pembinaan karakter, Ananda mengikuti kegiatan [nama kegiatan] pada tanggal [tanggal]."</i></span>
        <div id="kegAgamaList" style="display:flex;flex-direction:column;gap:6px"></div>
        <div style="margin-top:6px"><button class="btn sm" id="kegAgamaAdd" type="button">+ Tambah Kegiatan Keagamaan Bulan Ini</button></div>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">
      <button class="btn ghost danger" id="kExit" type="button">✕ Keluar</button>
      <div style="display:flex;gap:8px">
        <button class="btn" id="kCancel" type="button">Batal</button>
        <button class="btn primary" id="kSave" type="button">Simpan Pengaturan</button>
      </div>
    </div>
  </div></div>`);
  document.body.append(el);
  const close = () => el.remove();
  $("#kCancelTop", el).onclick = close;
  $("#kExitTop", el).onclick = close;
  $("#kCancel", el).onclick = close;
  $("#kExit", el).onclick = close;
  const kegRender = () => {
    const list = $("#kegList", el);
    list.replaceChildren(...k.kegiatan.map((g, i) => {
      const row = h(`<div class="keg-row"><input type="text" value="${esc(g.nama)}" placeholder="Nama kegiatan umum bulan ini" aria-label="Nama kegiatan ${i + 1}"><input type="text" value="${esc(g.tanggal)}" placeholder="Tanggal, mis. 3 Agustus 2026" aria-label="Tanggal kegiatan ${i + 1}"><button class="btn sm ghost danger" type="button" aria-label="Hapus kegiatan">Hapus</button></div>`);
      const [a, b] = row.querySelectorAll("input"); a.oninput = () => g.nama = a.value; b.oninput = () => g.tanggal = b.value;
      row.querySelector("button").onclick = () => { k.kegiatan.splice(i, 1); kegRender(); };
      return row;
    }));
  };
  const kegAgamaRender = () => {
    const list = $("#kegAgamaList", el);
    list.replaceChildren(...k.kegiatanKeagamaan.map((g, i) => {
      const row = h(`<div class="keg-row"><input type="text" value="${esc(g.nama)}" placeholder="Nama kegiatan keagamaan (mis. buka puasa bersama)" aria-label="Nama kegiatan keagamaan ${i + 1}"><input type="text" value="${esc(g.tanggal)}" placeholder="Tanggal (mis. 17 September)" aria-label="Tanggal kegiatan keagamaan ${i + 1}"><button class="btn sm ghost danger" type="button" aria-label="Hapus kegiatan keagamaan">Hapus</button></div>`);
      const [a, b] = row.querySelectorAll("input"); a.oninput = () => g.nama = a.value; b.oninput = () => g.tanggal = b.value;
      row.querySelector("button").onclick = () => { k.kegiatanKeagamaan.splice(i, 1); kegAgamaRender(); };
      return row;
    }));
  };
  kegRender();
  kegAgamaRender();
  $("#kegAdd", el).onclick = () => { k.kegiatan.push({ id: "k" + rid(), nama: "", tanggal: "" }); kegRender(); el.querySelectorAll("#kegList .keg-row input")[k.kegiatan.length * 2 - 2]?.focus(); };
  $("#kegAgamaAdd", el).onclick = () => { k.kegiatanKeagamaan.push({ id: "ka" + rid(), nama: "", tanggal: "" }); kegAgamaRender(); el.querySelectorAll("#kegAgamaList .keg-row input")[k.kegiatanKeagamaan.length * 2 - 2]?.focus(); };
  $("#k_sg", el).onchange = async (e) => { try { k.ttd = await readImage(e.target.files[0], 500, "image/png"); $("#k_sgT", el).style.backgroundImage = `url('${k.ttd}')`; $("#k_sgT", el).classList.add("has"); } catch (er) { toast(er.message); } };
  $("#kSave", el).onclick = () => {
    const prevLbl1 = S.kelas?.labelFoto1 !== undefined ? S.kelas.labelFoto1 : "Pendidikan";
    const prevLbl2 = S.kelas?.labelFoto2 !== undefined ? S.kelas.labelFoto2 : "Pendidikan";
    k.namaKelas = $("#k_nama", el).value.trim(); k.labelTtd = $("#k_ttd", el).value.trim(); k.waliKelas = $("#k_wali", el).value.trim();
    k.periode = $("#k_periode", el).value.trim(); k.tahun = $("#k_tahun", el).value.trim(); k.sapaan = $("#k_sapaan", el).value; k.templateId = $("#k_tpl", el).value; k.kota = $("#k_kota", el).value.trim(); k.tanggalCetak = $("#k_tgl", el).value;
    k.labelFoto1 = $("#k_lblFoto1", el).value;
    k.labelFoto2 = $("#k_lblFoto2", el).value;
    k.kegiatan = k.kegiatan.filter((g) => g.nama.trim());
    k.kegiatanKeagamaan = k.kegiatanKeagamaan.filter((g) => g.nama.trim());
    if (!k.namaKelas) { toast("Isi nama kelas dulu."); $("#k_nama", el).focus(); return; }
    S.students.forEach((stu) => {
      let changed = false;
      if (stu.labelFoto1 === undefined || stu.labelFoto1 === prevLbl1) { stu.labelFoto1 = k.labelFoto1; changed = true; }
      if (stu.labelFoto2 === undefined || stu.labelFoto2 === prevLbl2) { stu.labelFoto2 = k.labelFoto2; changed = true; }
      if (changed) queueSave(stu.id);
    });
    S.kelas = k; queueSave("kelas"); el.remove(); render();
    toast("✅ Pengaturan kelas dan daftar kegiatan bulan ini berhasil disimpan!");
  };
  setTimeout(() => $("#k_nama", el).focus(), 30);
}

// Global Escape key listener untuk menutup menu/modal/drawer aktif
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    const overlays = [...document.querySelectorAll(".overlay, .ed")];
    if (overlays.length) {
      const top = overlays[overlays.length - 1];
      const cancelBtn = top.querySelector("#upClose, #tClose, #kExitTop, #pgExitTop, #edExit, #pcExitTop, #dmExitTop");
      if (cancelBtn) cancelBtn.click();
      else top.remove();
    }
  }
});

/* ================= Mulai ================= */
$("#btnKelas").onclick = () => openKelas(false);
$("#btnDelStuMenu").onclick = () => openDeleteStudentsModal(S.sel);
$("#btnUploadCanva").onclick = () => openUploadCanvaModal();
$("#btnTpl").onclick = () => openTemplates();
$("#btnAllAI").onclick = () => runAI(S.students);
$("#btnZip").onclick = downloadZip;

const navIbnuBtn = $("#btnNavIbnu");
if (navIbnuBtn) navIbnuBtn.onclick = () => switchClass("ibnu_khaldun_1");
const navUmarBtn = $("#btnNavUmar");
if (navUmarBtn) navUmarBtn.onclick = () => switchClass("umar_bin_khattab_1");

(async () => {
  try {
    await loadAll();
    await loadTemplates();
  } catch (e) {
    toast("Data gagal dimuat: " + (e?.message || e?.code));
  }
  setSaveState(S.mode === "db" ? "Tersimpan" : "");
  render();
})();
window.__app = { S, T, switchClass, pdfBlob, buildPages, buildPrompt, addStudent, deleteStudentsByIds, openDeleteStudentsModal, saveTemplate, newTemplate, openEditor, openTemplates, openUploadCanvaModal, CONTOH_KELAS_IBNU_KHALDUN, CONTOH_KELAS_UMAR, CONTOH_SISWA_AKBAR, CONTOH_SISWA_FAIQAH, CONTOH_SISWA_BAIM };
</script>
</body>
