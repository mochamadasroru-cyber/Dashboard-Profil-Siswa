    }));

  timers[id] = setTimeout(() => flush(id), 700);

async function flush(id) {
  if (inflight[id]) { again[id] = true; return; }
  inflight[id] = true; pendingWrites++;
  try {
    const data = docData(id);
    if (S.mode === "db") {
      const docKey = id === "kelas" ? `kelas_${S.activeClass}` : id;
      const ref = db.collection("data/users/" + uid).doc(docKey);
      if (data) await ref.set(JSON.parse(JSON.stringify(data))); else await ref.delete();
    } else {
      lsWrite();

    else toast("Gagal menyimpan: " + (e?.message || e?.code || "coba lagi"));

    inflight[id] = false; pendingWrites--;
    if (again[id]) { again[id] = false; flush(id); }

}
async function loadAll() {

          if (leg.students && leg.students.length) S.classes.umar_bin_khattab_1.students = leg.students;
        }
      }
    } catch (e) { /* kosong */ }
  }

  // Pastikan setiap kelas memiliki inisialisasi lengkap
  for (const cid of Object.keys(S.classes)) {

}

function readImage(file, maxSide, type = "image/jpeg", quality = 0.82) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("File tidak bisa dibaca"));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Format gambar tidak didukung"));
      img.onload = () => {
        const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL(type, quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const imgCache = new Map();
function loadImg(src) {
  if (!src) return Promise.resolve(null);
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  imgCache.set(src, p); return p;
}

function cloudPath(ctx, x, y, w, hh) {
  ctx.beginPath();
  ctx.moveTo(x + CLOUD_BEZIER[0][0] * w, y + CLOUD_BEZIER[0][1] * hh);
  for (let i = 1; i < CLOUD_BEZIER.length; i++) {
    const [cx1, cy1, cx2, cy2, px, py] = CLOUD_BEZIER[i];
    ctx.bezierCurveTo(x + cx1 * w, y + cy1 * hh, x + cx2 * w, y + cy2 * hh, x + px * w, y + py * hh);
  }
  ctx.closePath();
}

function hexPath(ctx, x, y, w, hh) {
  ctx.beginPath();

  ctx.lineTo(x + .75 * w, y + hh); ctx.lineTo(x + .25 * w, y + hh); ctx.lineTo(x, y + hh / 2); ctx.closePath();
}

function drawStar8(ctx, cx, cy, rCard, rDiag) {

function normalizePhotoKey(key) {
  if (key === "foto1" || key === "portrait") return "foto1";
  if (key === "foto2" || key === "kegiatan" || key === "activity") return "foto2";
  if (key === "foto3" || key === "extra" || key === "bersama" || key === "group") return "foto3";
  return key || "foto1";
}

function getPhotoCfg(s, key) {
  const k = normalizePhotoKey(key);
  const raw = s?.photoCfg?.[k] || {};
  return {
    x: Number.isFinite(raw.x) ? raw.x : 0,
    y: Number.isFinite(raw.y) ? raw.y : 0,
    zoom: Number.isFinite(raw.zoom) && raw.zoom > 0 ? raw.zoom : 1,
    fit: raw.fit === "contain" ? "contain" : "cover",
    bg: raw.bg || "blur",
    rot: Number.isFinite(raw.rot) ? raw.rot : 0
  };
}

function setPhotoCfg(s, key, patch) {
  if (!s) return {};
  const k = normalizePhotoKey(key);
  s.photoCfg = s.photoCfg || {};
  s.photoCfg[k] = { ...getPhotoCfg(s, k), ...(patch || {}) };
  return s.photoCfg[k];
}

function computeSmartPortraitOffset(img, boxW, boxH, rot = 0) {
  if (!img) return { x: 0, y: 0, zoom: 1, fit: "cover", bg: "blur", rot: 0 };
  const r = (((rot || 0) % 360) + 360) % 360;
  const swapped = r === 90 || r === 270;
  const effW = swapped ? img.height : img.width;
  const effH = swapped ? img.width : img.height;
  const frameRatio = boxW / Math.max(1, boxH);
  const imgRatio = effW / Math.max(1, effH);
  // Jika gambar potret (lebih tinggi dari rasio frame), otomatis geser fokus ke area wajah/atas agar kepala tidak terpotong
  if (imgRatio < frameRatio * 0.92) {
    const baseSc = Math.max(boxW / effW, boxH / effH);
    const dh = effH * baseSc;
    const overflowRatio = (dh - boxH) / Math.max(1, boxH);
    const autoY = Math.round(Math.min(48, overflowRatio * 34));
    return { x: 0, y: autoY, zoom: 1, fit: "cover", bg: "blur", rot: r };
  }
  return { x: 0, y: 0, zoom: 1, fit: "cover", bg: "blur", rot: r };
}

function drawPhotoFitted(ctx, img, boxX, boxY, boxW, boxH, cfgIn) {
  const cfg = cfgIn || { x: 0, y: 0, zoom: 1, fit: "cover", bg: "blur", rot: 0 };
  const rot = (((cfg.rot || 0) % 360) + 360) % 360;
  const swapped = rot === 90 || rot === 270;
  const effW = swapped ? img.height : img.width;
  const effH = swapped ? img.width : img.height;
  const fit = cfg.fit === "contain" ? "contain" : "cover";
  const zoom = Math.max(0.25, Math.min(4, cfg.zoom || 1));

  // 1. Latar belakang frame (saat contain / zoom < 1 / digeser)
  const bgMode = cfg.bg || "blur";
  ctx.fillStyle = bgMode === "white" ? "#ffffff" : "#fce7f3";
  ctx.fillRect(boxX - 24, boxY - 24, boxW + 48, boxH + 48);

  if (bgMode === "blur") {
    ctx.save();
    const bgSc = Math.max((boxW + 32) / effW, (boxH + 32) / effH) * 1.12;
    const bcx = boxX + boxW / 2, bcy = boxY + boxH / 2;
    ctx.filter = "blur(14px)";
    ctx.globalAlpha = 0.55;
    ctx.translate(bcx, bcy);
    if (rot) ctx.rotate((rot * Math.PI) / 180);
    ctx.drawImage(img, (-img.width * bgSc) / 2, (-img.height * bgSc) / 2, img.width * bgSc, img.height * bgSc);
    ctx.restore();
  }

  // 2. Gambar utama dengan transformasi pan (x, y), zoom, fit, dan rotasi
  const baseSc = fit === "contain"
    ? Math.min(boxW / effW, boxH / effH)
    : Math.max(boxW / effW, boxH / effH);
  const sc = baseSc * zoom;
  const cx = boxX + boxW / 2 + ((cfg.x || 0) / 100) * boxW;
  const cy = boxY + boxH / 2 + ((cfg.y || 0) / 100) * boxH;

  ctx.save();
  ctx.translate(cx, cy);
  if (rot) ctx.rotate((rot * Math.PI) / 180);
  ctx.drawImage(img, (-img.width * sc) / 2, (-img.height * sc) / 2, img.width * sc, img.height * sc);
  ctx.restore();
}

function drawCloudPhoto(ctx, img, ox, oy, w, h, cfg) {

function drawPillBadge(ctx, text, px, py, pw, ph) {
  const cleanText = String(text ?? "").trim();
  if (!cleanText) return;
  const r = 31.26 * (ph / 112.97);
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(px, py, pw, ph, r);
  ctx.fillStyle = "#ffffff";
  ctx.fill();
  ctx.strokeStyle = "#a27e8a";
  ctx.lineWidth = Math.max(1.8, 6.2 * (ph / 112.97));
  ctx.stroke();

  ctx.fillStyle = "#000000";
  const sc = ph / 112.97;
  let fSize = Math.round(64 * sc);
  const minSize = Math.max(10, Math.round(28 * sc));
  for (; fSize > minSize; fSize -= Math.max(1, Math.round(2 * sc))) {
    ctx.font = `700 ${fSize}px "Plus Jakarta Sans", "Lexend", sans-serif`;
    if (ctx.measureText(cleanText).width <= pw - 96 * sc) break;
  }
  ctx.textAlign = "left";
  ctx.textBaseline = "middle";
  ctx.fillText(cleanText, px + 68 * sc, py + ph / 2 + 2 * sc);
  ctx.restore();
}

function splitStudentNameLines(rawName) {
  const words = String(rawName || "Nama Siswa").trim().split(/\s+/).filter(Boolean);
  if (!words.length) return ["Nama", "Siswa"];
  if (words.length <= 3) return words;
  if (words.length === 4) {
    if ((words[0] + words[1]).length <= (words[2] + words[3]).length) {
      return [words[0] + " " + words[1], words[2], words[3]];
    }
    return [words[0], words[1], words[2] + " " + words[3]];
  }
  const n1 = Math.ceil(words.length / 3);
  const n2 = Math.ceil((words.length - n1) / 2);
  return [
    words.slice(0, n1).join(" "),
    words.slice(n1, n1 + n2).join(" "),
    words.slice(n1 + n2).join(" ")
  ];
}

function drawStackedStudentName(ctx, rawName, xLeft = 244.53, maxW = 765) {

    if (lines.every((ln) => ctx.measureText(ln).width <= maxW)) break;
  }
  const lineStep = fSize * 0.938;
  const totalH = (lines.length - 1) * lineStep;
  const startY = 660 - totalH / 2;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  lines.forEach((ln, idx) => {
    const yy = startY + idx * lineStep;
    ctx.fillStyle = "rgba(248, 176, 67, 0.42)";
    ctx.fillText(ln, xLeft + 8.84, yy + 8.84);
    ctx.fillStyle = "#ed6a92";
    ctx.fillText(ln, xLeft, yy);
  });
  ctx.restore();
}

function drawTranslucentBox(ctx, x, y, w, h, r = 46.89) {
  ctx.save();
  ctx.globalAlpha = 0.50;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  const grad = ctx.createLinearGradient(x, y + h / 2, x + w, y + h / 2);
  grad.addColorStop(0, "#fafefd");
  grad.addColorStop(1, "#9bc6cb");
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.globalAlpha = 0.68;
  ctx.strokeStyle = "#a27e8a";

/* ================= Teks paragraf -> token kata (miring/tebal) ================= */
function tokenize(text, boldName) {
  // *istilah* = miring; **…** dibuang; nama lengkap ditebalkan otomatis
  let t = String(text || "").replace(/\*\*(.+?)\*\*/g, "$1").trim();
  const segs = [];
  const re = /\*([^*]+)\*/g; let last = 0, m;
  while ((m = re.exec(t))) { if (m.index > last) segs.push({ s: t.slice(last, m.index), i: false }); segs.push({ s: m[1], i: true }); last = re.lastIndex; }
  if (last < t.length) segs.push({ s: t.slice(last), i: false });
  const words = [];
  let prevSpace = true;
  for (const sg of segs) {
    const glueFirst = words.length > 0 && !prevSpace && !/^\s/.test(sg.s);
    sg.s.split(/\s+/).filter(Boolean).forEach((w, j) => words.push({ w, i: sg.i, b: false, glue: j === 0 && glueFirst }));
    prevSpace = /\s$/.test(sg.s);
  }
  if (boldName) {
    const nw = boldName.trim().split(/\s+/).map((x) => x.toLowerCase());
    const strip = (w) => w.toLowerCase().replace(/[.,;:!?)"']+$/, "");
    for (let i = 0; i + nw.length <= words.length; i++) {
      if (nw.every((x, j) => strip(words[i + j].w) === x)) for (let j = 0; j < nw.length; j++) words[i + j].b = true;
    }
  }
  return words;
}
function tokensHtml(words) {
  let out = "";
  words.forEach((w, n) => {
    let t = esc(w.w);
    if (w.i) t = `<em>${t}</em>`;
    if (w.b) t = `<strong>${t}</strong>`;
    out += (n && !w.glue ? " " : "") + t;
  });
  return out;
}

/* ================= Susun halaman (paginasi per kata) ================= */
function paragraphsOf(s) {
  const k = S.kelas, nama = s.nama || "";
  const list = [];
  const bulan = k.periode || "…", tahun = k.tahun || (k.tanggalCetak || "").slice(0, 4);
  list.push({ sec: "_salam", idx: 0, cls: "salam", words: tokenize("Assalamu'alaikum Warahmatullahi Wabarakatuh.") });
  list.push({ sec: "_intro1", idx: 0, words: tokenize(`Salam hangat kami sampaikan kepada Ayah/Bunda Ananda ${nama}. Semoga Ayah/Bunda dan keluarga senantiasa diberikan kesehatan, keberkahan, serta selalu berada dalam lindungan Allah Swt.`) });
  list.push({ sec: "_intro2", idx: 0, words: tokenize(`Puji syukur ke hadirat Tuhan Yang Maha Esa atas segala rahmat-Nya sehingga proses pembelajaran dan kegiatan sekolah selama bulan ${bulan} dapat berjalan dengan baik. Tak lupa selawat dan salam kita haturkan kepada Nabi Muhammad SAW., beserta keluarga, sahabat, dan pengikutnya hingga akhir zaman.`) });
  list.push({ sec: "_intro3", idx: 0, words: tokenize(`Melalui profil kali ini, kami ingin menyampaikan perkembangan Ananda selama bulan ${bulan}${tahun ? " " + tahun : ""} berdasarkan pengamatan dan penilaian Bapak/Ibu guru selama kegiatan belajar dan aktivitas di sekolah.`) });
  for (const p of PARA_SECTIONS) {
    (s.final?.[p.id] || []).forEach((t, idx) => {
      if (t.trim()) list.push({ sec: p.id, idx, words: tokenize(t, nama) });
    });
  }
  list.push({ sec: "_outro", idx: 0, words: tokenize(`Demikian profil perkembangan ${sapaan()} ${nama} kami sampaikan. Terima kasih atas kerja sama dan dukungan Ayah/Bunda dalam mendampingi perkembangan ${sapaan()} di rumah.`) });
  return list;
}
function closingHtml() {
  const k = S.kelas;
  return `<div class="closing"><p>Wassalamu’alaikum warahmatullahi wabarakatuh.</p>
    <div class="sign">${esc(k.kota || "")}, ${esc(tanggalIndo(k.tanggalCetak))}<br>Wali Kelas, ${esc(k.labelTtd || k.namaKelas || "")}
    ${k.ttd ? `<img src="${k.ttd}" alt="">` : `<div class="gap"></div>`}${esc(k.waliKelas || "")}</div></div>`;
}
async function buildPages(s, stage, tplIn) {
  const tpl = tplIn || await resolveTpl(activeTplMeta());
  await ensureFonts(tpl);
  const nameRaw = s.nama || "Nama Siswa", kelasUp = (S.kelas.namaKelas || "Kelas").toUpperCase();
  let l1, l2;
  if (tpl.builtin) {
    [l1, l2] = await Promise.all([
      renderHeader({ first: true, name: nameRaw, kelas: kelasUp, student: s, photos: { group: getStudentPhoto(s, "foto3"), portrait: getStudentPhoto(s, "foto1"), activity: getStudentPhoto(s, "foto2") } }),
      renderHeader({ first: false, name: nameRaw, kelas: kelasUp, student: s }),
    ]);
  } else {
    [l1, l2] = await Promise.all([renderLayer(tpl, "first", s), renderLayer(tpl, "next", s)]);
  }
  const b1 = bodyBox(tpl, "first", s), b2 = bodyBox(tpl, "next", s);
  stage.innerHTML = "";
  const pages = [];
  const newPage = () => {
    const first = !pages.length, b = first ? b1 : b2;
    const pg = h(`<div class="pg${tpl.builtin ? "" : " custom"}" style="${typoVars(tpl, s)}"><img class="pg-layer" src="${first ? l1 : l2}" alt="">
      <div class="pg-body" style="left:${b.x * PXMM}px;top:${b.y * PXMM}px;width:${b.w * PXMM}px;height:${b.h * PXMM}px"><div class="pg-flow"></div></div></div>`);
    stage.append(pg); pages.push(pg); return pg;
  };
  let pg = newPage(), flow = $(".pg-flow", pg), body = $(".pg-body", pg);
  const fits = () => flow.offsetHeight <= body.clientHeight + 0.5;
  const next = () => { pg = newPage(); flow = $(".pg-flow", pg); body = $(".pg-body", pg); };

  for (const para of paragraphsOf(s)) {
    let words = para.words, cont = false;
    while (words.length) {
      const el = document.createElement("p");
      if (para.cls) el.className = para.cls;
      if (cont) el.classList.add("cont");
      if (para.sec) { el.dataset.sec = para.sec; el.dataset.idx = para.idx; }
      el.innerHTML = tokensHtml(words); flow.append(el);
      if (fits()) break;
      // cari jumlah kata terbanyak yang muat di sisa halaman ini
      let lo = 0, hi = words.length - 1;
      while (lo < hi) { const mid = Math.ceil((lo + hi + 1) / 2); el.innerHTML = tokensHtml(words.slice(0, mid)); if (fits()) lo = mid; else hi = mid - 1; }
      const pageHasOther = flow.children.length > 1;
      // hindari sisa 1–2 baris yatim di bawah halaman: pindahkan utuh
      if (lo < 14 && pageHasOther) { el.remove(); next(); continue; }
      // hindari sisa sangat pendek di halaman berikutnya: bawa beberapa kata ikut pindah
      if (words.length - lo < 10 && lo > 30) lo = words.length - 10;
      el.innerHTML = tokensHtml(words.slice(0, lo)); el.classList.add("split");
      words = words.slice(lo); cont = true; next();
    }
  }
  const cl = h(closingHtml()); flow.append(cl);
  if (!fits()) { cl.remove(); next(); flow.append(h(closingHtml())); }
  await Promise.all([...stage.querySelectorAll("img")].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));
  return pages;
}

function getStudentPhoto(s, key) {
  if (!s) return "";
  if (key === "foto1" || key === "portrait") return s.foto1 || s.fotoPortrait || "";
  if (key === "foto2" || key === "kegiatan") return s.foto2 || s.fotoKegiatan || "";
  if (key === "foto3" || key === "extra" || key === "bersama") return s.foto3 || s.fotoExtra || "";
  return s[key] || "";
}

function setStudentPhoto(s, key, val) {
  if (!s) return;
  if (key === "foto1" || key === "portrait") { s.foto1 = val; s.fotoPortrait = val; }
  else if (key === "foto2" || key === "kegiatan") { s.foto2 = val; s.fotoKegiatan = val; }
  else if (key === "foto3" || key === "extra" || key === "bersama") { s.foto3 = val; s.fotoExtra = val; }
  else { s[key] = val; }
}

function getPhotoCaptionProp(keyOrIdx) {
  if (keyOrIdx === 0 || keyOrIdx === "0" || keyOrIdx === "foto1" || keyOrIdx === "portrait") return "labelFoto1";
  if (keyOrIdx === 1 || keyOrIdx === "1" || keyOrIdx === "foto2" || keyOrIdx === "kegiatan") return "labelFoto2";
  return "labelFoto3";
}

function getPhotoCaption(s, keyOrIdx) {
  const prop = getPhotoCaptionProp(keyOrIdx);
  if (s && s[prop] !== undefined) return String(s[prop]);
  if (S.kelas && S.kelas[prop] !== undefined) return String(S.kelas[prop]);
  return "Pendidikan";
}

function setPhotoCaption(s, keyOrIdx, val) {
  if (!s) return;
  const prop = getPhotoCaptionProp(keyOrIdx);
  s[prop] = String(val ?? "");
}

function getTemplatePhotoFrames(tpl, s) {
  if (!tpl || tpl.builtin) {
    const baseFrames = [
      { id: "bf1", num: 1, key: "foto1", src: "foto1", label: "Foto 1 (Awan Kiri)", page: "first", shape: "cloud", x: 89.2, y: 25.5, w: 53.2, h: 49.8, border: "#a27e8a", borderW: 0.9 },

    ];
    return baseFrames.map((b, idx) => {
      const ov = Array.isArray(s?.layout?.frames) ? (s.layout.frames.find((f) => f.id === b.id) || s.layout.frames[idx]) : s?.layout?.frames?.[b.id];
      return ov ? { ...b, ...ov } : b;
    });
  }
  const photoEls = (tpl.els || []).filter((e) => e.kind === "foto");
  if (!photoEls.length) {

  }
  return photoEls.map((e, idx) => {

    const key = e.src === "kegiatan" || e.src === "foto2" ? "foto2" : e.src === "extra" || e.src === "foto3" || e.src === "bersama" ? "foto3" : (e.src || defaultKey);
    const base = {
      ...e,
      num,
      key,
      label: e.label || PHOTO_SRC[e.src] || `Foto Frame ${num}`
    };
    const ov = Array.isArray(s?.layout?.frames) ? (s.layout.frames.find((f) => f.id === e.id) || s.layout.frames[idx]) : s?.layout?.frames?.[e.id];
    if (ov) {
      Object.assign(base, ov);
    }
    return base;
  });
}

async function fitBackground(file) {

async function extractCanvaDesign(file) {
  if (file.type === "application/pdf" || file.name?.toLowerCase().endsWith(".pdf")) {
    if (typeof pdfjsLib === "undefined") throw new Error("Library pembaca PDF belum siap. Mohon periksa koneksi internet.");
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const count = pdf.numPages;
    if (count < 1) throw new Error("File PDF tidak memiliki halaman.");

    const renderPage = async (pageNo) => {
      const page = await pdf.getPage(pageNo);
      const vp = page.getViewport({ scale: 1 });
      const scale = 1588 / vp.width;
      const svp = page.getViewport({ scale });
      const cv = document.createElement("canvas");
      cv.width = Math.round(svp.width);
      cv.height = Math.round(svp.height);
      const ctx = cv.getContext("2d");
      await page.render({ canvasContext: ctx, viewport: svp }).promise;

      for (const q of [0.85, 0.75, 0.65, 0.55]) {
        const d = cv.toDataURL("image/jpeg", q);
        if (d.length < 245000) return d;
      }
      const c2 = document.createElement("canvas");
      c2.width = Math.round(cv.width * 0.8);
      c2.height = Math.round(cv.height * 0.8);
      c2.getContext("2d").drawImage(cv, 0, 0, c2.width, c2.height);
      return c2.toDataURL("image/jpeg", 0.75);
    };

    const first = await renderPage(1);
    const next = count >= 2 ? await renderPage(2) : null;
    return { first, next, isPdf: true, pageCount: count };
  } else {
    const first = await fitBackground(file);
    return { first, next: null, isPdf: false, pageCount: 1 };
  }
}

function joinNatural(items, conj = "serta") {
  const arr = (items || []).map((x) => String(x || "").trim()).filter(Boolean);
  if (!arr.length) return "";
  if (arr.length === 1) return arr[0];
  if (arr.length === 2) return `${arr[0]} dan ${arr[1]}`;
  return `${arr.slice(0, -1).join(", ")}, ${conj} ${arr[arr.length - 1]}`;
}

function cleanClause(str) {
  let s = String(str || "").trim().replace(/[.]+$/, "").trim();
  if (!s) return "";
  s = s.replace(/\bpraktek\b/gi, "praktik").replace(/\bsholat\b/gi, "salat");
  return s;
}

function lowerFirstUnlessProper(str) {
  const s = cleanClause(str);

}

    .replace(/^laporan dari dewan guru,?\s*/i, "")
    .replace(/\b(naura|dzakira|baim|syafiq|sakha|ananda)\b\s*/gi, "")
    .replace(/\bmalas\b/gi, "masih perlu dimotivasi untuk lebih giat")
    .replace(/\bnakal\b/gi, "masih perlu diarahkan untuk menjaga ketertiban")
    .replace(/\bsuka menjawab\b/gi, "terkadang masih perlu diarahkan agar menyampaikan pendapat dengan lebih santun")
    .replace(/\bsering tidak fokus\b/gi, "masih perlu terus berlatih menjaga fokus")
    .replace(/\bkurang fokus\b/gi, "masih perlu terus berlatih menjaga fokus")
    .replace(/\bsuka ngobrol\b/gi, "terkadang masih terlihat mengobrol dengan teman")
    .replace(/\bsuka bercanda\b/gi, "terkadang masih terlihat bercanda saat kegiatan berlangsung");
  s = lowerFirstUnlessProper(s);
  if (!/^(masih|terkadang|perlu|sesekali|diharapkan)/.test(s)) {
    s = `masih perlu terus berlatih dalam hal ${s}`;
  }
  return s;
}

function buildPrompt(s) {
  const k = S.kelas || {}, sp = sapaan(), spRule = sp === "Ananda"
    ? 'Sebut siswa "Ananda" dengan A kapital secara konsisten di semua posisi kalimat.'
    : 'Sebut siswa "ananda" dengan huruf kecil, kecuali di awal kalimat.';
  const data = { periode: k.periode, kelas: k.namaKelas, nama_lengkap: "{{NAMA}}", nama_panggilan: "{{PANGGILAN}}", data_dari_wali_kelas: inputForPrompt(s) };
  return `Anda adalah asisten wali kelas di SMP Islam Modern Al Fakhir yang menyusun paragraf laporan profil perkembangan siswa untuk orang tua/wali, periode bulan ${k.periode}.

Tulis HANYA isi per bagian dengan bahasa Indonesia yang hangat, sopan, natural, mudah dipahami orang tua, profesional tetapi tidak kaku. Tulisan harus objektif berdasarkan data yang diberikan, tidak mengada-ada, serta menyampaikan apresiasi dan evaluasi secara halus dan membangun. Perhatikan susunan kata dan kohesi antarkalimat di setiap aspek.

DATA SISWA (JSON):
${JSON.stringify(data, null, 2)}

STRUKTUR & PEDOMAN PENULISAN TIAP ASPEK
1. akademik (1–2 paragraf):
   - Paragraf 1 mulai: "Dalam bidang akademik, Alhamdulillah ${sp} {{NAMA}} menunjukkan perkembangan yang positif serta sikap belajar yang patut diapresiasi." Sampaikan sikap belajar saat pembelajaran, mata pelajaran yang disukai/dikuasai, serta hal positif yang tampak dari diri ${sp}.
   - Paragraf 2 berisi hal yang perlu ditingkatkan (disampaikan secara santun dan membangun, mis. "Namun demikian, berdasarkan pengamatan Bapak/Ibu guru, ${sp} masih perlu terus berlatih menjaga fokus…"), ditutup harapan ("Ke depannya, kami berharap ${sp} {{PANGGILAN}} dapat…").

2. nonAkademik (1–2 paragraf):
   - Paragraf 1 mulai: "Dalam bidang non-akademik dan pengembangan diri, ${sp} {{PANGGILAN}} turut berpartisipasi dengan baik dalam berbagai agenda sekolah, yaitu …" berisi kegiatan umum bulanan yang diikuti beserta tanggalnya, dilanjutkan kegiatan khusus bulan ini jika ada. (Catatan: kegiatan setiap bulan dapat berbeda-beda sesuai data bulan berjalan; tulis hanya kegiatan yang diikuti pada data).
   - Paragraf 2 berisi ekstrakurikuler yang diikuti ("Untuk menyalurkan minat dan bakatnya, ${sp} mengikuti kegiatan ekstrakurikuler …"), peran/kontribusi, catatan pengembangan diri yang diperhalus dengan santun, ditutup harapan ("Semoga ${sp} {{PANGGILAN}} senantiasa bersemangat dalam mengembangkan bakat dan kemampuannya di berbagai bidang.").

3. keagamaan (1 paragraf utuh sesuai Pedoman Penulisan Aspek Keagamaan & Pembinaan Karakter Kelas 9 Umar Bin Khattab):
   - Gunakan ejaan konsisten: salat berjamaah, dzikir, murojaah, aula atau musala, Tahfiz/Tahsin, Al-Qur'an, ${sp}.
   - Kalimat pembuka kegiatan keagamaan (jika ada kegiatan keagamaan seperti puasa sunnah / buka puasa bersama beserta tanggalnya):
     "Pada aspek keagamaan dan pembinaan karakter, ${sp} mengikuti kegiatan [nama kegiatan dan tanggal, jika tersedia]."
   - Pilih Versi 1 atau Versi 2 sesuai data ketertiban/catatan wali kelas:
     • Versi 1 (Siswa tertib dan disiplin — gunakan apabila siswa selalu datang tepat waktu dan tertib):
       "Dalam pelaksanaan salat berjamaah, dzikir, dan murojaah, ${sp} selalu datang tepat waktu ke aula atau musala serta mengikuti kegiatan dengan tertib dan disiplin."
     • Versi 2 (Siswa yang masih perlu diingatkan — gunakan jika ada catatan khusus seperti masih bercanda/mengobrol atau perlu diingatkan menuju aula/musala):
       "Dalam pelaksanaan salat berjamaah, dzikir, dan murojaah, ${sp} terkadang masih terlihat bercanda atau mengobrol dengan teman, serta perlu diingatkan agar segera menuju aula atau musala ketika waktu kegiatan tiba. Ke depannya, ${sp} diharapkan dapat lebih menjaga ketertiban, meningkatkan kedisiplinan, dan mengikuti kegiatan keagamaan dengan lebih khusyuk." (Sesuaikan secara proporsional jika wali kelas menulis catatan perilaku spesifik lain, menggunakan ungkapan halus seperti "terkadang masih terlihat", "perlu diingatkan", dan hindari kata menghakimi seperti "malas", "nakal", "tidak peduli", atau "buruk").
   - Kalimat capaian Tahfiz/Tahsin:
     • Jika ada capaian spesifik (mis. "Utsmani 2 halaman 33"): "Dalam pembelajaran Tahfiz/Tahsin, progres ${sp} saat ini telah mencapai [capaian Tahfiz/Tahsin]."
     • Jika capaian hanya berupa penilaian umum (mis. "perkembangan baik" atau "Baik"): "Dalam pembelajaran Tahfiz/Tahsin, perkembangan ${sp} saat ini menunjukkan hasil yang baik." Jangan mengarang jilid atau halaman apabila tidak diberikan.
   - Kalimat penutup harapan:
     • Versi 1: "Semoga ${sp} dapat terus menjaga semangat dan konsistensi dalam beribadah serta meningkatkan kemampuan membaca Al-Qur'an."
     • Versi 2: "Semoga ${sp} dapat terus memperbaiki kebiasaan tersebut dan meningkatkan semangat serta konsistensi dalam beribadah dan belajar membaca Al-Qur'an."

4. prestasi (1 paragraf):
   - Mulai "Alhamdulillah, ${sp} {{PANGGILAN}} …". Lomba dan juara HANYA ditulis di bagian ini. Jika tidak ada prestasi maupun lomba, kembalikan [].

5. kedisiplinan (1 paragraf):
   - Mulai "Dalam aspek kehadiran dan kedisiplinan, …". Sebutkan jumlah ketidakhadiran persis sesuai data dengan angka (mis. "tidak hadir karena sakit sebanyak 2 kali").
   - Untuk jenis yang jumlahnya > 0: sakit (doakan kesehatan & ingatkan menjaga kesehatan serta pola istirahat), izin (sampaikan secara santun agar mengurangi izin bila tidak mendesak & menjaga konsistensi kehadiran), alfa (ingatkan agar lebih disiplin hadir tepat waktu agar tidak tertinggal materi).
   - Jika sakit, izin, dan alfa semuanya 0, apresiasi kehadiran penuh ${sp}. Bila ada tanggal keterlambatan (tglTerlambat), sebutkan tanggal dan bulannya tanpa tahun serta motivasi santun.

6. kesimpulan (2 paragraf):
   - Paragraf 1 mulai "Secara keseluruhan, Alhamdulillah ${sp} {{NAMA}} …" (apresiasi karakter positif dan kelebihan paling menonjol dalam keseharian di sekolah).
   - Paragraf 2 mulai "Ke depannya, ${sp} diharapkan dapat …" (hal yang perlu dikembangkan, diikuti kalimat penutup sinergi bersama antara guru di sekolah dan Ayah/Bunda di rumah).

ATURAN FAKTA & GAYA (WAJIB)
- Prioritas tertinggi adalah kesesuaian dengan data dan arahan wali kelas. Jangan mengarang fakta, jilid/halaman Tahfiz, atau kegiatan yang tidak ada di data.
- ${spRule}
- Istilah asing/bahasa Inggris ditandai miring dengan *…* (mis. *Inspirational Class*, *Badminton*). Jangan memakai markdown lain: tanpa judul, tanpa **tebal**, tanpa daftar.

FORMAT JAWABAN: hanya satu objek JSON, tanpa teks lain:
{"akademik":["…","…"],"nonAkademik":["…","…"],"keagamaan":["…"],"prestasi":["…"],"kedisiplinan":["…"],"kesimpulan":["…","…"]}`;
}

function fillNames(text, s) {
  const pg = (s.panggilan || (s.nama || "").split(/\s+/)[0] || "").trim();
  return String(text).replaceAll("{{NAMA}}", s.nama || "").replaceAll("{{PANGGILAN}}", pg).replace(/\s+/g, " ").trim();
}

function generateSmartNarrative(s) {
  const k = S.kelas || {};
  const inp = s.input || {};
  const nama = (s.nama || "Ananda").trim();
  const pg = (s.panggilan || nama.split(/\s+/)[0] || "Ananda").trim();
  const sp = sapaan();
  const final = {};

  // =========================================================================
  // 1. BIDANG AKADEMIK
  // =========================================================================
  const akLines = [];
  const mapelRaw = cleanClause(inp.mapel);
  const sikapRaw = cleanClause(inp.sikapBelajar);
  const posRaw = cleanClause(inp.positifBelajar);
  const tingRaw = cleanClause(inp.tingkatkanBelajar);
  const catAkRaw = cleanClause(inp.catatanAkademik);

  const mapelList = mapelRaw ? mapelRaw.split(/\s*,\s*|\s+dan\s+/i).map((x) => x.trim()).filter(Boolean) : [];
  const mapelStr = joinNatural(mapelList, "dan");

  let ak1 = `Dalam bidang akademik, Alhamdulillah ${sp} ${nama} menunjukkan perkembangan yang positif serta sikap belajar yang patut diapresiasi.`;
  if (sikapRaw && mapelStr) {
    const sLow = lowerFirstUnlessProper(sikapRaw.replace(/^(ananda\s+)?(dikenal\s+|terlihat\s+)?/i, ""));
    ak1 += ` ${sp} dikenal ${sLow}${/pembelajaran|kelas/i.test(sLow) ? "" : " selama proses pembelajaran berlangsung"}, serta memiliki antusiasme yang menonjol terutama pada mata pelajaran ${mapelStr}.`;
  } else if (mapelStr) {
    ak1 += ` ${sp} memiliki antusiasme dan minat belajar yang baik terutama pada mata pelajaran ${mapelStr}.`;
  } else if (sikapRaw) {
    const sLow = lowerFirstUnlessProper(sikapRaw.replace(/^(ananda\s+)?(dikenal\s+|terlihat\s+)?/i, ""));
    ak1 += ` Selama proses pembelajaran berlangsung, ${sp} dikenal ${sLow}.`;
  }
  if (posRaw) {
    const pLow = lowerFirstUnlessProper(posRaw.replace(/^(hal positif yang tampak adalah\s*|ananda\s*)/i, ""));
    ak1 += ` Hal positif yang tampak dari diri ${sp} adalah ${pLow}.`;
  }
  akLines.push(ak1.replace(/\s+/g, " ").trim());

  if (tingRaw || catAkRaw) {
    const softened = softenAcademicNote(tingRaw, catAkRaw, sp);
    let ak2 = `Namun demikian, berdasarkan pengamatan Bapak/Ibu guru, ${sp} ${softened}${/agar|sehingga/i.test(softened) ? "" : " agar pemahaman materi yang diperoleh semakin utuh dan mendalam"}. Ke depannya, kami berharap ${sp} ${pg} dapat mengelola perhatian dan ketekunan belajarnya dengan lebih baik sehingga potensi akademiknya yang baik dapat berkembang secara lebih optimal.`;
    akLines.push(ak2.replace(/\s+/g, " ").trim());
  } else {
    akLines.push(`Ke depannya, kami berharap ${sp} ${pg} dapat senantiasa mempertahankan semangat dan ketekunan belajarnya sehingga potensi akademik yang dimiliki dapat berkembang secara lebih optimal.`);
  }
  final.akademik = akLines;

  // =========================================================================
  // 2. NON-AKADEMIK & PENGEMBANGAN DIRI (Mendukung Kegiatan Bulanan Dinamis)
  // =========================================================================
  const nonLines = [];
  const skip = new Set(inp.kegiatanSkip || []);
  const ikut = (k.kegiatan || []).filter((g) => !skip.has(g.id) && String(g.nama || "").trim());
  const ekskulRaw = cleanClause(inp.ekskul);
  const kegKhususRaw = cleanClause(inp.kegiatanKhusus);
  const peranRaw = cleanClause(inp.peran);
  const catPengRaw = cleanClause(inp.catatanPengembangan);

  const formatKegiatanItem = (g) => {
    let nm = cleanClause(g.nama);
    if (/^memberikan suara\b/i.test(nm)) {
      nm = "ikut serta " + nm.charAt(0).toLowerCase() + nm.slice(1);
    } else if (/^debat osis$/i.test(nm)) {
      nm = "kegiatan Debat OSIS";
    } else if (/^aep\b/i.test(nm) && !nm.startsWith("*")) {
      nm = `*${nm}*`;
    }
    const tgl = cleanClause(g.tanggal);
    return tgl ? `${nm} pada ${tgl}` : nm;
  };

  let non1 = "";
  if (ikut.length) {
    const listKeg = joinNatural(ikut.map(formatKegiatanItem), "serta");
    non1 = `Dalam bidang non-akademik dan pengembangan diri, ${sp} ${pg} turut berpartisipasi dengan baik dalam berbagai agenda sekolah, yaitu ${listKeg}.`;
  } else {
    non1 = `Dalam bidang non-akademik dan pengembangan diri, ${sp} ${pg} turut berpartisipasi dengan baik dalam berbagai agenda dan kegiatan pengembangan diri di sekolah.`;
  }
  if (kegKhususRaw) {
    const khFormatted = /^(inspirational class|market day|outbound|field trip|class meeting|study tour)$/i.test(kegKhususRaw) && !kegKhususRaw.includes("*")
      ? `*${kegKhususRaw}*`
      : kegKhususRaw;
    non1 += ` Selain kegiatan umum tersebut, ${sp} juga berpartisipasi aktif dalam kegiatan ${khFormatted} di sekolah.`;
  }
  nonLines.push(non1.replace(/\s+/g, " ").trim());

  if (ekskulRaw || peranRaw || catPengRaw) {
    let non2 = "";
    if (ekskulRaw) {
      const eksList = ekskulRaw.split(/\s*,\s*|\s+dan\s+/i).map((x) => {
        const t = x.trim();
        return /^(badminton|futsal|basket|basketball|coding|robotik|robotics|english club|archery)$/i.test(t) ? `*${t}*` : t;
      }).filter(Boolean);
      non2 += `Untuk menyalurkan minat dan bakatnya, ${sp} mengikuti kegiatan ekstrakurikuler ${joinNatural(eksList, "dan")} dengan penuh semangat. `;
    }
    if (peranRaw && catPengRaw) {
      const pLow = lowerFirstUnlessProper(peranRaw.replace(/^(menunjukkan peran yang\s+|peran\s+)/i, ""));
      let cLow = lowerFirstUnlessProper(catPengRaw.replace(/^(meskipun\s+|namun\s+)/i, ""));
      if (/^tingkatkan\b/i.test(cLow)) {
        cLow = "terus dimotivasi untuk " + cLow.replace(/^tingkatkan(\s+lagi)?\b/i, "meningkatkan");
      }
      non2 += `Dalam setiap aktivitas yang diikuti, ${sp} menunjukkan peran yang ${pLow}, meskipun ${cLow}. `;
    } else if (peranRaw) {
      const pLow = lowerFirstUnlessProper(peranRaw.replace(/^(menunjukkan peran yang\s+|peran\s+)/i, ""));
      non2 += `Dalam setiap aktivitas yang diikuti, ${sp} menunjukkan peran yang ${pLow}. `;
    } else if (catPengRaw) {
      let cLow = lowerFirstUnlessProper(catPengRaw);
      if (/^tingkatkan\b/i.test(cLow)) {
        cLow = "diharapkan dapat terus " + cLow.replace(/^tingkatkan(\s+lagi)?\b/i, "meningkatkan");
      }
      non2 += `Dalam mengikuti setiap aktivitas, ${sp} ${cLow}. `;
    }
    non2 += `Semoga ${sp} ${pg} senantiasa bersemangat dalam mengembangkan bakat dan kemampuannya di berbagai bidang.`;
    nonLines.push(non2.replace(/\s+/g, " ").trim());
  } else {
    nonLines.push(`Semoga ${sp} ${pg} senantiasa bersemangat dalam mengembangkan bakat, kepercayaan diri, serta kemampuannya di berbagai bidang.`);
  }
  final.nonAkademik = nonLines;

  // =========================================================================
  // 3. ASPEK KEAGAMAAN & PEMBINAAN KARAKTER
  //    (Sesuai Pedoman Kelas 9 Umar Bin Khattab: Versi 1 & Versi 2,
  //     salat berjamaah, dzikir, murojaah, aula atau musala, Tahfiz/Tahsin, Al-Qur'an)
  // =========================================================================
  const kegAgamaList = getStudentKeagamaanActivities(s);
  const versiMode = String(inp.versiKeagamaan ?? "").trim();
  const capaianTahfizRaw = cleanClause(inp.capaianTahfiz);
  const perluBinaRaw = cleanClause(inp.perluDibina);
  const catKgRaw = cleanClause(inp.catatanKeagamaan);
  const peranMuhRaw = cleanClause(inp.peranMuhadhoroh);
  const tahfizRate = cleanClause(inp.tahfiz);

  // Tentukan apakah menggunakan Versi 2 (Siswa yang masih perlu diingatkan) atau Versi 1 (Siswa tertib & disiplin)
  const hasReminderNote = Boolean(
    perluBinaRaw && !/^(tidak ada|belum ada|-|tertib|baik|sangat baik)$/i.test(perluBinaRaw)
  );
  const isVersi2 = versiMode === "versi2" || (versiMode !== "versi1" && hasReminderNote);

  const kgParts = [];

  // (a) Kalimat pembuka kegiatan keagamaan bulan ini
  if (kegAgamaList.length > 0) {
    const kegStr = joinNatural(kegAgamaList.map((x) => {
      const cl = cleanClause(x);
      return /^(puasa|buka puasa|salat|dzikir|peringatan|pesantren|tasmi|kajian|mabit|santunan)/i.test(cl)
        ? cl.charAt(0).toLowerCase() + cl.slice(1)
        : cl;
    }), "dan");
    kgParts.push(`Pada aspek keagamaan dan pembinaan karakter, ${sp} mengikuti kegiatan ${kegStr}.`);
  } else {
    kgParts.push(`Pada aspek keagamaan dan pembinaan karakter, Alhamdulillah ${sp} mengikuti rangkaian kegiatan pembiasaan ibadah harian di sekolah.`);
  }

  // (b) Kalimat inti pelaksanaan salat berjamaah, dzikir, dan murojaah (Versi 1 vs Versi 2)
  if (!isVersi2) {
    // Versi 1 — Siswa tertib dan disiplin
    kgParts.push(`Dalam pelaksanaan salat berjamaah, dzikir, dan murojaah, ${sp} selalu datang tepat waktu ke aula atau musala serta mengikuti kegiatan dengan tertib dan disiplin.`);
  } else {
    // Versi 2 — Siswa yang masih perlu diingatkan
    const isDefaultVersi2Note = !perluBinaRaw || /bercanda|mengobrol|ngobrol|aula|musala/i.test(perluBinaRaw);
    if (isDefaultVersi2Note) {
      kgParts.push(`Dalam pelaksanaan salat berjamaah, dzikir, dan murojaah, ${sp} terkadang masih terlihat bercanda atau mengobrol dengan teman, serta perlu diingatkan agar segera menuju aula atau musala ketika waktu kegiatan tiba.`);
      kgParts.push(`Ke depannya, ${sp} diharapkan dapat lebih menjaga ketertiban, meningkatkan kedisiplinan, dan mengikuti kegiatan keagamaan dengan lebih khusyuk.`);
    } else {
      let customBina = lowerFirstUnlessProper(
        perluBinaRaw
          .replace(/\bmalas\b/gi, "kurang bersemangat")
          .replace(/\bnakal\b/gi, "kurang tertib")
          .replace(/\bburuk\b/gi, "perlu ditingkatkan")
      );
      if (/^(lebih|meningkatkan|fokus|kurangi)/i.test(customBina)) {
        customBina = `perlu diingatkan untuk ${customBina.replace(/^kurangi\b/i, "mengurangi")}`;
      } else if (!/^(terkadang|masih|perlu|sesekali)/.test(customBina)) {
        customBina = `masih memerlukan bimbingan dalam hal ${customBina}`;
      }
      kgParts.push(`Dalam pelaksanaan salat berjamaah, dzikir, dan murojaah, ${sp} ${customBina}.`);
      kgParts.push(`Ke depannya, ${sp} diharapkan dapat lebih menjaga ketertiban, meningkatkan kedisiplinan, dan mengikuti kegiatan keagamaan dengan lebih khusyuk.`);
    }
  }

  // (c) Kalimat perkembangan pembelajaran Tahfiz/Tahsin
  if (capaianTahfizRaw) {
    const isGeneralTahfiz = /^(perkembangan\s+baik|baik|sangat\s+baik|cukup|cukup\s+baik|lancar)$/i.test(capaianTahfizRaw);
    if (isGeneralTahfiz) {
      const qual = /sangat\s+baik/i.test(capaianTahfizRaw) ? "sangat baik" : /cukup/i.test(capaianTahfizRaw) ? "cukup baik" : "baik";
      kgParts.push(`Dalam pembelajaran Tahfiz/Tahsin, perkembangan ${sp} saat ini menunjukkan hasil yang ${qual}.`);
    } else {
      const capClean = capaianTahfizRaw.replace(/^(telah mencapai|mencapai|progres saat ini)\s+/i, "");
      kgParts.push(`Dalam pembelajaran Tahfiz/Tahsin, progres ${sp} saat ini telah mencapai ${capClean}.`);
    }
  } else if (tahfizRate) {
    if (/^(baik|sangat baik)$/i.test(tahfizRate)) {
      kgParts.push(`Dalam pembelajaran Tahfiz/Tahsin, perkembangan ${sp} saat ini menunjukkan hasil yang ${tahfizRate.toLowerCase()}.`);
    } else {
      kgParts.push(`Dalam pembelajaran Tahfiz/Tahsin, perkembangan ${sp} saat ini berjalan cukup baik dan terus berproses secara bertahap.`);
    }
  }

  // (d) Catatan Muhadhoroh / tambahan jika diisi
  if (peranMuhRaw && !/^(belum ada|tidak ada|-|belum|tidak)$/i.test(peranMuhRaw)) {
    kgParts.push(`Selain itu, dalam kegiatan Muhadhoroh, ${sp} turut berperan aktif sebagai ${peranMuhRaw}.`);
  }
  if (catKgRaw) {
    kgParts.push(`${catKgRaw.charAt(0).toUpperCase() + catKgRaw.slice(1)}.`);
  }

  // (e) Kalimat penutup harapan (sesuai Versi 1 / Versi 2)
  if (!isVersi2) {
    kgParts.push(`Semoga ${sp} dapat terus menjaga semangat dan konsistensi dalam beribadah serta meningkatkan kemampuan membaca Al-Qur'an.`);
  } else {
    kgParts.push(`Semoga ${sp} dapat terus memperbaiki kebiasaan tersebut dan meningkatkan semangat serta konsistensi dalam beribadah dan belajar membaca Al-Qur'an.`);
  }

  final.keagamaan = [kgParts.join(" ").replace(/\s+/g, " ").trim()];

  // =========================================================================
  // 4. PRESTASI & LOMBA (Hanya jika ada data prestasi atau lomba)
  // =========================================================================
  const presRaw = cleanClause(inp.prestasi);
  const lombaRaw = cleanClause(inp.lomba);
  const tktLombaRaw = cleanClause(inp.tingkatLomba);

  if (presRaw || lombaRaw) {
    let pr1 = "";
    if (lombaRaw && presRaw) {
      const tktStr = tktLombaRaw ? ` tingkat ${tktLombaRaw.toLowerCase()}` : "";
      pr1 = `Alhamdulillah, ${sp} ${pg} juga turut berpartisipasi aktif dalam memeriahkan perlombaan${tktStr}, yaitu pada cabang lomba ${lombaRaw}, serta berhasil menorehkan capaian yang membanggakan dengan ${lowerFirstUnlessProper(presRaw)}. Keikutsertaan dan pencapaian ini menjadi pengalaman berharga bagi ${sp} dalam melatih kekompakan, sportivitas, serta semangat berprestasi.`;
    } else if (lombaRaw) {
      const tktStr = tktLombaRaw ? ` tingkat ${tktLombaRaw.toLowerCase()}` : "";
      const lmbFormatted = /^(estafet sarung|balon dead match|class meeting)$/i.test(lombaRaw) && !lombaRaw.includes("*") ? `*${lombaRaw}*` : lombaRaw;
      pr1 = `Alhamdulillah, ${sp} ${pg} juga turut berpartisipasi aktif dalam memeriahkan perlombaan${tktStr}, yaitu pada cabang lomba ${lmbFormatted}. Keikutsertaan ini menjadi pengalaman berharga bagi ${sp} dalam melatih kekompakan, sportivitas, serta kerja sama tim bersama teman-teman sekelasnya.`;
    } else {
      pr1 = `Alhamdulillah, ${sp} ${pg} menunjukkan potensi dan daya juang yang membanggakan dengan berhasil meraih prestasi, yaitu ${lowerFirstUnlessProper(presRaw)}. Pencapaian ini menjadi motivasi positif bagi ${sp} untuk terus mengembangkan potensi terbaiknya.`;
    }
    final.prestasi = [pr1.replace(/\s+/g, " ").trim()];
  } else {
    final.prestasi = [];
  }

  // =========================================================================
  // 5. KEHADIRAN & KEDISIPLINAN
  // =========================================================================
  const sNum = parseInt(inp.sakit, 10) || 0;
  const iNum = parseInt(inp.izin, 10) || 0;
  const aNum = parseInt(inp.alfa, 10) || 0;
  const terlambat = cleanClause(inp.terlambat);
  let tglTerlambat = cleanClause(inp.tglTerlambat);
  if (tglTerlambat) {
    tglTerlambat = tglTerlambat.replace(/\b20\d{2}\b/g, "").replace(/\s+/g, " ").replace(/\s*,/g, ",").replace(/[.,]+$/, "").trim();
  }
  const disUmum = cleanClause(inp.disiplinUmum) || "Baik";
  const catDis = cleanClause(inp.catatanDisiplin);

  const isNoLate = !terlambat || /^(tidak ada|0|-)$/i.test(terlambat);
  let disParts = [];

  if (sNum === 0 && iNum === 0 && aNum === 0) {
    if (isNoLate && !tglTerlambat) {
      disParts.push(`Dalam aspek kehadiran dan kedisiplinan, Alhamdulillah ${sp} ${pg} menunjukkan komitmen yang sangat baik dengan mencatatkan kehadiran penuh tanpa adanya catatan sakit, izin, alfa, maupun keterlambatan hadir ke sekolah sepanjang bulan ini.`);
    } else {
      disParts.push(`Dalam aspek kehadiran dan kedisiplinan, Alhamdulillah ${sp} ${pg} mencatatkan kehadiran penuh tanpa adanya catatan ketidakhadiran karena sakit, izin, maupun alfa sepanjang bulan ini.`);
    }
  } else {
    const abs = [];
    if (sNum > 0) abs.push(`tidak hadir karena sakit sebanyak ${sNum} kali`);
    if (iNum > 0) abs.push(`tidak hadir karena izin sebanyak ${iNum} kali`);
    if (aNum > 0) abs.push(`tidak hadir tanpa keterangan (alfa) sebanyak ${aNum} kali`);
    const noAlfaLateSuffix = aNum === 0 && isNoLate && !tglTerlambat ? ", tanpa adanya catatan alfa maupun keterlambatan hadir ke sekolah" : "";
    disParts.push(`Dalam aspek kehadiran dan kedisiplinan, tercatat ${sp} ${joinNatural(abs, "serta")}${noAlfaLateSuffix}.`);

    if (sNum > 0) {
      disParts.push(`Kami mendoakan semoga ${sp} ${pg} senantiasa diberikan kesehatan yang prima, serta mengingatkan agar ${sp} selalu menjaga kesehatan dan pola istirahatnya sehingga dapat mengikuti kegiatan pembelajaran di sekolah dengan optimal.`);
    }
    if (iNum > 0) {
      disParts.push(`Kami juga menyampaikan secara santun agar ke depannya ${sp} dapat mengurangi izin apabila tidak terdapat keperluan yang mendesak dan terus menjaga konsistensi kehadirannya${disUmum ? `, mengingat kedisiplinan umum ${sp} di sekolah sudah tergolong ${disUmum.toLowerCase()}` : ""}.`);
    }
    if (aNum > 0) {
      disParts.push(`Kami mengingatkan secara santun agar ${sp} lebih disiplin dalam menjaga kehadiran di sekolah karena dikhawatirkan akan banyak materi pelajaran yang tertinggal.`);
    }
  }

  if (!isNoLate || tglTerlambat) {
    const kaliStr = !isNoLate ? (/^\d+$/.test(terlambat) ? `${terlambat} kali` : terlambat) : "";
    if (kaliStr && tglTerlambat) {
      disParts.push(`Adapun mengenai ketepatan waktu, ${sp} tercatat mengalami keterlambatan sebanyak ${kaliStr}, yaitu pada tanggal ${tglTerlambat}. Ke depannya, ${sp} diharapkan dapat mempersiapkan diri dan berangkat lebih awal agar senantiasa hadir tepat waktu di sekolah.`);
    } else if (tglTerlambat) {
      disParts.push(`Adapun mengenai ketepatan waktu, ${sp} tercatat mengalami keterlambatan pada tanggal ${tglTerlambat}. Ke depannya, ${sp} diharapkan dapat mempersiapkan diri dan berangkat lebih awal agar senantiasa hadir tepat waktu di sekolah.`);
    } else {
      disParts.push(`Adapun mengenai ketepatan waktu, catatan keterlambatan ${sp} tercatat ${kaliStr}. Ke depannya, ${sp} diharapkan dapat lebih memperhatikan ketepatan waktu hadir di sekolah.`);
    }
  }

  if (disUmum && iNum === 0) {
    disParts.push(`Secara umum, tingkat kedisiplinan dan kepatuhan ${sp} terhadap tata tertib sekolah tergolong ${disUmum.toLowerCase()}.`);
  }
  if (catDis) {
    disParts.push(`${catDis.charAt(0).toUpperCase() + catDis.slice(1)}.`);
  }
  final.kedisiplinan = [disParts.join(" ").replace(/\s+/g, " ").trim()];

  // =========================================================================
  // 6. KESIMPULAN
  // =========================================================================
  const kelebihanRaw = cleanClause(inp.kelebihan);
  const dikembangkanRaw = cleanClause(inp.dikembangkan);

  let ks1 = `Secara keseluruhan, Alhamdulillah ${sp} ${nama} menunjukkan perkembangan yang positif selama mengikuti kegiatan di sekolah`;
  if (kelebihanRaw) {
    const kelLow = lowerFirstUnlessProper(kelebihanRaw.replace(/^sikap\s+/i, ""));
    ks1 += `, di mana sikap ${kelLow} menjadi kelebihan yang paling menonjol dalam kesehariannya di sekolah. Semangat ${sp} dalam belajar di kelas maupun berpartisipasi dalam berbagai kegiatan sekolah dan ekstrakurikuler menjadi modal yang sangat baik bagi perkembangannya.`;
  } else {
    ks1 += `. Sikap santun, keramahan, serta kesungguhan ${sp} dalam mengikuti kegiatan belajar maupun pembiasaan ibadah menjadi modal yang sangat baik bagi perkembangannya.`;
  }

  let ks2 = `Ke depannya, ${sp} diharapkan dapat `;
  if (dikembangkanRaw) {
    let dikLow = lowerFirstUnlessProper(dikembangkanRaw.replace(/^(harus|perlu|diharapkan\s+dapat)\s+/i, ""));
    if (!/^(lebih|terus|meningkatkan|mengembangkan|menjaga|membiasakan)/.test(dikLow)) {
      dikLow = `lebih meningkatkan ${dikLow}`;
    } else if (!dikLow.startsWith("lebih ") && !dikLow.startsWith("terus ")) {
      dikLow = `lebih ${dikLow}`;
    }
    ks2 += `${dikLow}. `;
  } else {
    ks2 += `terus mempertahankan semangat belajar serta meningkatkan ketertiban dan kemandirian dirinya. `;
  }
  ks2 += `Dengan pembiasaan yang konsisten serta pendampingan bersama antara guru di sekolah dan Ayah/Bunda di rumah, kami optimis ${sp} ${pg} dapat meraih prestasi dan perkembangan karakter yang semakin membanggakan.`;

  final.kesimpulan = [ks1.replace(/\s+/g, " ").trim(), ks2.replace(/\s+/g, " ").trim()];

  return final;
}

async function generateFor(s, signal) {
  if (sample && typeof sample.json === "function") {
    try {
      const res = await sample.json(buildPrompt(s), { signal, modelTier: "default" });
      if (res && typeof res === "object") {
        const final = {};
        for (const p of PARA_SECTIONS) {
          const arr = Array.isArray(res[p.id]) ? res[p.id] : (typeof res[p.id] === "string" && res[p.id] ? [res[p.id]] : []);
          final[p.id] = arr.map((t) => fillNames(t, s)).filter(Boolean);
        }
        return final;
      }
    } catch (e) {
      console.warn("AI online tidak aktif, beralih ke Smart Narrative Engine bawaan:", e);
    }
  }
  return generateSmartNarrative(s);
}
function warningsFor(s) {
  const w = [], f = s.final || {}, inp = s.input || {};
  const all = PARA_SECTIONS.flatMap((p) => f[p.id] || []).join(" ");
  if (!all.trim()) return w;
  const low = all.toLowerCase();
  if (/\{\{|\}\}/.test(all)) w.push("Masih ada placeholder {{…}} di teks.");
  if (/\bpraktek\b/i.test(all)) w.push('Ejaan "praktek" sebaiknya "praktik".');
  if (/\*\*/.test(all)) w.push("Ada tanda ** (tebal) yang akan dibuang saat cetak.");
  const items = (str) => String(str || "").split(/,|\bdan\b/i).map((x) => x.trim()).filter((x) => x.length > 2);
  for (const x of [...items(inp.ekskul), ...items(inp.lomba)]) {
    const key = x.toLowerCase().replace(/praktek/g, "praktik");
    if (!low.replace(/praktek/g, "praktik").includes(key)) w.push(`"${x}" dari data tidak ditemukan di paragraf. Cek apakah tertulis atau ejaannya berubah.`);
  }
  const disiplin = (f.kedisiplinan || []).join(" ");
  for (const [k, lbl] of [["sakit", "sakit"], ["izin", "izin"], ["alfa", "alfa"]]) {
    const n = parseInt(inp[k], 10);
    if (n > 0 && !new RegExp(`\\b${n}\\s*kali`).test(disiplin)) w.push(`Jumlah ${lbl} (${n} kali) belum tertulis di paragraf kehadiran.`);
  }
  if (["sakit", "izin", "alfa"].some((k) => String(inp[k] ?? "").trim()) && !disiplin.trim()) w.push("Ada data kehadiran, tetapi paragraf kehadiran masih kosong.");
  if (!(f.akademik || []).length) w.push("Bagian akademik masih kosong.");
  if (!(f.kesimpulan || []).length) w.push("Bagian kesimpulan masih kosong.");
  return w;
}

  const handleFile = async (file) => {
    if (!file) return;
    drop.style.display = "none";
    loading.style.display = "block";
    preview.style.display = "none";
    submitBtn.disabled = true;

    try {
      extracted = await extractCanvaDesign(file);
      loading.style.display = "none";
      preview.style.display = "block";
      submitBtn.disabled = false;

      thumbs.innerHTML = `
        <div class="canva-thumb-card">
          <div class="canva-thumb-img" style="background-image:url('${extracted.first}')"></div>
          <div class="canva-thumb-tag">Halaman 1 (Utama)</div>
        </div>
        ${extracted.next ? `
        <div class="canva-thumb-card">
          <div class="canva-thumb-img" style="background-image:url('${extracted.next}')"></div>
          <div class="canva-thumb-tag">Halaman 2 (Lanjutan)</div>
        </div>` : `
        <div class="canva-thumb-card">
          <div class="canva-thumb-img" style="background-image:url('${extracted.first}');opacity:0.6"></div>
          <div class="canva-thumb-tag">Halaman Lanjutan (Duplikat)</div>
        </div>`}
      `;
    } catch (err) {
      loading.style.display = "none";
      drop.style.display = "flex";
      toast("Gagal membaca file: " + err.message, 5000);
    }
  };

  fileInp.onchange = () => handleFile(fileInp.files?.[0]);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("dragover"); };
  drop.ondragleave = () => drop.classList.remove("dragover");
  drop.ondrop = (e) => {
    e.preventDefault();
    drop.classList.remove("dragover");
    handleFile(e.dataTransfer.files?.[0]);
  };

  submitBtn.onclick = async () => {
    if (!extracted) return;
    submitBtn.disabled = true;
    submitBtn.textContent = "Menyimpan…";

    try {
      const usageMode = $("input[name='canvaUsageMode']:checked", el)?.value || "clean";
      let tpl;
      let descInfo = "";
      if (usageMode === "clean") {
        const topY = parseInt($("#canvaBodyTopOffset", el)?.value || "88", 10);
        tpl = newTemplate(0, "rounded", "#ffffff", "canvaFull", topY);
        descInfo = "Mode Latar Murni Canva";
      } else {
        const pCount = parseInt($("input[name='canvaPhotoCount']:checked", el)?.value || "2", 10);
        const pPreset = $("input[name='canvaLayoutPreset']:checked", el)?.value || "fotoKiri";
        const pShape = $("#canvaPhotoShape", el)?.value || "rounded";
        const pBorder = $("#canvaPhotoBorder", el)?.value || "#ffffff";
        tpl = newTemplate(pCount, pShape, pBorder, pPreset);
        descInfo = `${pCount} frame foto`;
      }
      tpl.classId = S.activeClass; // Ruang kerja Canva terpisah per kelas
      tpl.nama = $("#canvaName", el).value.trim() || defName;
      const imgs = { first: extracted.first, next: extracted.next || extracted.first };
      const saved = await saveTemplate(tpl, imgs);

      const setActive = $("#canvaSetActive", el).checked;
      if (setActive && S.kelas) {
        S.kelas.templateId = saved.id;
        queueSave("kelas");
      }
      close();
      render();
      toast(`🎉 Desain "${saved.nama}" berhasil disimpan khusus untuk ${currentClassTitle}${setActive ? " dan langsung dipasang!" : "."}`);
      if (S.sel) {
        S.tab = "pratinjau";
        renderWork();
      }
    } catch (e) {
      submitBtn.disabled = false;
      submitBtn.textContent = "Pasang Desain Ini";
      toast("Gagal menyimpan: " + (e.message || e.code), 5000);
    }
  };
}

      <div style="display:flex;gap:8px">

  $("#tCancelTop", el).onclick = close;

    const on = (S.kelas?.templateId || "builtin") === t.id;
    const c = h(`<div class="tpl-card ${on ? "on" : ""}"><div class="tpl-thumb">${t.builtin ? "Bawaan" : t.bg?.first ? "" : "Tanpa latar"}</div>

    const thumb = $(".tpl-thumb", c);
    if (t.builtin) thumb.style.background = "linear-gradient(135deg, #fff5f6 0%, #9bc6cb 100%)";
    else if (t.bg?.first) getTplImage(`${t.id}_first`).then((d) => { if (d) thumb.style.backgroundImage = `url('${d}')`; });
    c.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === "use") { S.kelas.templateId = t.id; queueSave("kelas"); close(); renderWork(); toast(`Desain "${t.nama}" dipakai untuk kelas ini.`); }
      if (a === "edit") { close(); openEditor(structuredClone(t), false); }
      if (a === "dup") {
        const copy = { ...structuredClone(t), id: "t_" + rid(), nama: t.nama + " (salinan)", createdAt: Date.now() };
        const imgs = {}; for (const k of ["first", "next"]) if (t.bg?.[k]) imgs[k] = await getTplImage(`${t.id}_${k}`);
        try { await saveTemplate(copy, imgs); paint(); } catch (e) { toast("Gagal menduplikat: " + (e.message || e.code)); }
      }
      if (a === "del") {
        if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = "Yakin hapus?"; return; }
        try { await deleteTemplate(t); paint(); toast("Desain dihapus."); } catch (e) { toast("Gagal menghapus: " + (e.message || e.code)); }
      }
    });
    return c;
  };
  const classTemplates = T.list.filter((t) => t.classId === S.activeClass);
  const paint = () => list.replaceChildren(card(curBuiltin), ...classTemplates.map(card));
  paint();
}

function openEditor(t, isNew) {
  const sampleStu = cur() || { nama: "Nama Siswa", foto1: "", foto2: "", foto3: "", fotoPortrait: "", fotoKegiatan: "", fotoExtra: "" };
  const imgs = { first: null, next: null }, changed = {};
  let page = "first", sel = t.els.find((e) => e.kind === "body" && e.page === "first")?.id, layerTimer = 0;
  t.body = { ...DEFAULT_BODY, ...(t.body || {}) };

  const ed = h(`<div class="ed" role="dialog" aria-modal="true" aria-label="Editor desain PDF">
    <div class="ed-top">

      <button class="btn ghost danger" id="edExit" type="button" title="Keluar langsung ke halaman utama">✕ Keluar</button>
      <button class="btn primary" id="edSave" type="button">Simpan desain</button>
    </div>
    <div class="ed-main">
      <aside class="ed-side" id="edSide"></aside>
      <div class="ed-view" id="edView"><div class="ed-slot" id="edSlot"><div class="ed-page" id="edPage">
        <img class="pg-layer" id="edLayer" alt=""><div class="pg-body" id="edBody"><div class="pg-flow"></div></div><div id="edBoxes"></div>
      </div></div></div>
    </div></div>`);
  document.body.append(ed);
  const view = $("#edView", ed), slot = $("#edSlot", ed), pageEl = $("#edPage", ed);
  let k = 1;
  const fit = () => {
    const availW = view.clientWidth - 40, availH = view.clientHeight - 40;
    k = Math.max(0.2, Math.min(availW / 794, (availH > 300 ? availH : 1123) / 1123, 1));
    pageEl.style.transform = `scale(${k})`; slot.style.width = 794 * k + "px"; slot.style.height = 1123 * k + "px";
  };
  const ro = new ResizeObserver(fit); ro.observe(view);

  const els = () => t.els.filter((e) => e.page === page);
  const selEl = () => t.els.find((e) => e.id === sel);
  const label = (e) => e.kind === "body" ? "Area teks paragraf" : e.kind === "nama" ? "Nama siswa" : e.kind === "kelas" ? "Nama kelas" : PHOTO_SRC[e.src] || "Foto";

  async function paintLayer() {
    const tpl = { ...t, bgFirstSrc: imgs.first, bgNextSrc: imgs.next };

    $("#edLayer", ed).src = await renderLayer(tpl, page, sampleStu);
  }
  const queueLayer = () => { clearTimeout(layerTimer); layerTimer = setTimeout(paintLayer, 120); };
  function paintBody() {
    const b = els().find((e) => e.kind === "body");
    const body = $("#edBody", ed);
    pageEl.setAttribute("style", pageEl.getAttribute("style").replace(/--[^;]+;?/g, "") + ";" + typoVars(t));
    pageEl.style.transform = `scale(${k})`;
    if (!b) { body.hidden = true; return; }
    body.hidden = false;
    Object.assign(body.style, { left: b.x * PXMM + "px", top: b.y * PXMM + "px", width: b.w * PXMM + "px", height: b.h * PXMM + "px" });
    const paras = page === "first"

    $(".pg-flow", body).innerHTML = paras.join("");
  }
  function paintBoxes() {
    const wrap = $("#edBoxes", ed);

      const bx = h(`<div class="ebox ${e.kind === "body" ? "body" : ""} ${e.id === sel ? "on" : ""}" style="left:${e.x * PXMM}px;top:${e.y * PXMM}px;width:${e.w * PXMM}px;height:${e.h * PXMM}px"><span class="tag">${esc(label(e))}</span><span class="rs" aria-hidden="true"></span></div>`);
      bx.addEventListener("pointerdown", (ev) => startDrag(ev, e, ev.target.classList.contains("rs") ? "resize" : "move", bx));
      return bx;
    }));
  }
  function startDrag(ev, e, mode, bx) {

    if (sel !== e.id) { sel = e.id; paintSide(); }

    const sx = ev.clientX, sy = ev.clientY, o = { x: e.x, y: e.y, w: e.w, h: e.h };

      if (e.kind === "body") paintBody();

    const up = () => { bx.removeEventListener("pointermove", move); bx.removeEventListener("pointerup", up); bx.removeEventListener("pointercancel", up); if (e.kind !== "body") queueLayer(); };

        <div class="f"><label for="eb_ind">Inden awal (mm)</label><input type="number" min="0" max="20" step="0.5" id="eb_ind" data-b="indentMm" value="${b.indentMm}"></div>
      </div></div></div>`));
    side.querySelectorAll("[data-pg]").forEach((bt) => bt.onclick = () => { page = bt.dataset.pg; sel = els().find((x) => x.kind === "body")?.id; repaint(); });
    side.querySelectorAll("[data-sel]").forEach((bt) => bt.onclick = () => { sel = bt.dataset.sel; paintSide(); paintBoxes(); });
    side.querySelectorAll("[data-add]").forEach((bt) => bt.onclick = () => {
      const kind = bt.dataset.add, base = { id: rid(), kind, page };
      if (kind === "foto") {
        const curFotos = t.els.filter((x) => x.kind === "foto");
        if (curFotos.length >= 3) {
          toast("Maksimal 3 frame foto per desain.");
          return;
        }
        const fNum = curFotos.length + 1;
        const src = fNum === 1 ? "foto1" : fNum === 2 ? "foto2" : "foto3";
        const ne = { ...base, x: 140, y: 20 + (fNum - 1) * 35, w: 42, h: 42, src, shape: "circle", border: "#8b5cf6", borderW: 1.4, label: `Foto ${fNum}` };
        t.els.push(ne); sel = ne.id; repaint();
      } else {
        const ne = { ...base, x: 18, y: kind === "nama" ? 30 : 47, w: 120, h: kind === "nama" ? 15 : 12, font: "Luckiest Guy", color: "#7be3f2", stroke: "#8b5cf6", strokeW: 1, shadow: true, align: "left", upper: true };
        t.els.push(ne); sel = ne.id; repaint();
      }
    });
    side.querySelectorAll("[data-bg]").forEach((inp) => inp.onchange = async () => {
      const file = inp.files?.[0]; if (!file) return;
      try {
        $("#edState", ed).textContent = "Memproses…";
        const res = await extractCanvaDesign(file);
        if (res.isPdf) {
          imgs.first = res.first; changed.first = true;
          if (res.next) { imgs.next = res.next; changed.next = true; }
          toast(res.next ? "PDF Canva 2 halaman berhasil dimuat!" : "PDF Canva 1 halaman dimuat!");
        } else {
          imgs[inp.dataset.bg] = res.first; changed[inp.dataset.bg] = true;
          const im = await loadImg(res.first);
          if (im && Math.abs(im.height / im.width - 297 / 210) > 0.04) toast("Ukuran gambar bukan A4, jadi akan sedikit direnggangkan. Sebaiknya ekspor dari desain A4.", 5000);
        }
        $("#edState", ed).textContent = "";
        repaint();
      } catch (er) {
        $("#edState", ed).textContent = "";
        toast("Gagal memuat: " + er.message);
      }
    });
    side.querySelectorAll("[data-bgclr]").forEach((bt) => bt.onclick = () => { imgs[bt.dataset.bgclr] = null; changed[bt.dataset.bgclr] = true; repaint(); });
    side.querySelectorAll("[data-p]").forEach((inp) => {
      const ev = inp.type === "range" || inp.type === "color" ? "input" : "change";
      inp.addEventListener(ev, () => {
        const ee = selEl(); if (!ee) return;
        ee[inp.dataset.p] = inp.type === "checkbox" ? inp.checked : inp.dataset.num != null ? parseFloat(inp.value) : inp.value;
        if (inp.id === "ep_bw") $("#ep_bwv", ed).textContent = inp.value + " mm";
        if (inp.id === "ep_sw") $("#ep_swv", ed).textContent = inp.value + " mm";
        queueLayer(); if (inp.dataset.p === "src") { paintBoxes(); $(`[data-sel="${ee.id}"]`, ed).lastChild.textContent = label(ee); }
      });
    });
    side.querySelectorAll("[data-pos]").forEach((inp) => inp.addEventListener("input", () => {
      const ee = selEl(), v = parseFloat(inp.value); if (!ee || isNaN(v)) return;
      ee[inp.dataset.pos] = v; paintBoxes(); if (ee.kind === "body") paintBody(); else queueLayer();
    }));
    side.querySelectorAll("[data-b]").forEach((inp) => inp.addEventListener("input", () => {
      t.body[inp.dataset.b] = inp.type === "number" ? parseFloat(inp.value) || t.body[inp.dataset.b] : inp.value; paintBody();
    }));
    const del = $("#epDel", ed);
    if (del) del.onclick = () => { t.els = t.els.filter((x) => x.id !== sel); sel = els().find((x) => x.kind === "body")?.id; repaint(); };
  }
  function repaint() { paintSide(); paintBody(); paintBoxes(); queueLayer(); }

  $("#edCancel", ed).onclick = () => { ro.disconnect(); ed.remove(); openTemplates(); };
  $("#edExit", ed).onclick = () => { ro.disconnect(); ed.remove(); };
  $("#edSave", ed).onclick = async () => {
    t.nama = $("#edName", ed).value.trim() || "Desain tanpa nama";
    const btn = $("#edSave", ed); btn.disabled = true; $("#edState", ed).textContent = "Menyimpan…";
    try {
      const up = {}; for (const kk of ["first", "next"]) if (changed[kk]) up[kk] = imgs[kk];
      const meta = await saveTemplate(t, up);
      if (isNew && S.kelas) { S.kelas.templateId = meta.id; queueSave("kelas"); }
      ro.disconnect(); ed.remove(); render();
      toast(isNew ? `Desain "${meta.nama}" disimpan dan dipakai untuk kelas ini.` : `Desain "${meta.nama}" disimpan.`);
    } catch (e) {
      btn.disabled = false; $("#edState", ed).textContent = "";
      toast(e?.code === "invalid_argument" ? "Tidak bisa menyimpan. Pastikan Anda punya akses Contributor, atau kecilkan gambar latar." : "Gagal menyimpan: " + (e.message || e.code), 5000);
    }
  };
  (async () => {
    for (const kk of ["first", "next"]) if (t.bg?.[kk]) imgs[kk] = await getTplImage(`${t.id}_${kk}`);
    fit(); repaint();
  })();
}

function switchClass(targetId) {
  if (!S.classes[targetId]) return;

function renderList() {
  const ul = $("#stuList"); if (!ul) return;
  const q = (S.filter || "").toLowerCase();
  const visible = S.students.map((s, i) => ({ s, i })).filter(({ s }) => !q || (s.nama || "").toLowerCase().includes(q) || (s.panggilan || "").toLowerCase().includes(q));
  if (!visible.length && S.students.length > 0) {
    ul.innerHTML = `<li class="stu-empty-hint" style="padding:16px 8px;text-align:center;color:var(--muted);font-size:12.5px">Tidak ada siswa yang cocok</li>`;
  } else {
    ul.replaceChildren(...visible.map(({ s, i }) => {
      const st = statusOf(s);
      const li = h(`<li class="stu-row-item">
        <button class="stu" aria-current="${s.id === S.sel}" type="button">
          <span class="no">${i + 1}</span>
          <span class="nm">${esc(s.nama || "Siswa baru")}</span>
          <span class="dot ${st}" title="${STATUS_LABEL[st]}"></span>
        </button>
        <button class="stu-quick-del" type="button" title="Hapus siswa '${esc(s.nama || "Siswa baru")}'" aria-label="Hapus ${esc(s.nama || "Siswa baru")}">✕</button>
      </li>`);
      li.querySelector(".stu").onclick = () => select(s.id);
      const qDel = li.querySelector(".stu-quick-del");
      qDel.onclick = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        if (qDel.dataset.armed) {
          deleteStudentsByIds([s.id]);
          toast(`🗑️ Data siswa "${s.nama || "Siswa baru"}" telah dihapus.`);
          return;
        }
        qDel.dataset.armed = "1";
        qDel.textContent = "Hapus?";
        qDel.classList.add("armed");
        setTimeout(() => {
          if (qDel.isConnected) {
            delete qDel.dataset.armed;
            qDel.textContent = "✕";
            qDel.classList.remove("armed");
          }
        }, 3500);
      };
      return li;
    }));
  }
  const c = { kosong: 0, draf: 0, siap: 0 }; S.students.forEach((s) => c[statusOf(s)]++);
  const totalStu = S.students.length || 1;
  const pctReady = S.students.length ? Math.round(((c.siap + c.draf * 0.5) / totalStu) * 100) : 0;
  $("#count").textContent = S.filter ? `${visible.length}/${S.students.length}` : S.students.length;

  $("#btnZip").disabled = !c.siap;
}

async function addStudent(data) {
  const s = { id: "s_" + rid(), urut: Date.now(), nama: "", panggilan: "", foto1: "", foto2: "", foto3: "", fotoPortrait: "", fotoKegiatan: "", fotoExtra: "", input: { kegiatanSkip: [] }, final: {}, ...(data || {}) };
  S.students.push(s); S.sel = s.id; S.tab = "data"; queueSave(s.id); render();
  if (!data) setTimeout(() => $("#f_nama")?.focus(), 30);
}
const cur = () => S.students.find((x) => x.id === S.sel);
function touch(s) { queueSave(s.id); renderList(); const chip = $("#stChip"); if (chip) { const st = statusOf(s); chip.className = "chip " + st; chip.textContent = STATUS_LABEL[st]; } }

function deleteStudentsByIds(ids) {
  const idSet = new Set(Array.isArray(ids) ? ids : [ids]);
  if (!idSet.size) return 0;
  const before = S.students.length;
  S.students = S.students.filter((x) => !idSet.has(x.id));
  const removedCount = before - S.students.length;
  if (idSet.has(S.sel)) {
    S.sel = S.students[0]?.id || null;
  }
  idSet.forEach((id) => queueSave(id));
  render();
  return removedCount;
}

  const syncSelectionSummary = () => {
    // Bersihkan ID yang sudah tidak ada
    for (const id of [...selectedIds]) {
      if (!S.students.some((s) => s.id === id)) selectedIds.delete(id);
    }
    selCountEl.textContent = selectedIds.size;
    btnDelSel.textContent = `🗑️ Hapus Siswa Terpilih (${selectedIds.size})`;
    btnDelSel.disabled = selectedIds.size === 0;
    btnClearSel.disabled = selectedIds.size === 0;
    $("#dmDelAll", el).disabled = S.students.length === 0;
  };

  const renderModalList = () => {
    syncSelectionSummary();
    if (!S.students.length) {
      listWrap.replaceChildren(h(`<div style="padding:32px 16px;text-align:center;color:var(--muted)">
        <div style="font-size:28px;margin-bottom:6px">📭</div>
        <div style="font-weight:700;color:var(--fg);margin-bottom:4px">Daftar siswa sudah kosong</div>
        <div style="font-size:12.5px">Klik "+ Tambah siswa" di halaman utama untuk menambahkan nama siswa baru.</div>
      </div>`));
      return;
    }

    const filtered = S.students
      .map((stu, idx) => ({ stu, idx }))
      .filter(({ stu }) => !searchQuery || (stu.nama || "").toLowerCase().includes(searchQuery) || (stu.panggilan || "").toLowerCase().includes(searchQuery));

    if (!filtered.length) {
      listWrap.replaceChildren(h(`<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px">Tidak ada nama siswa yang cocok dengan pencarian "${esc(searchQuery)}".</div>`));
      return;
    }

    listWrap.replaceChildren(...filtered.map(({ stu, idx }) => {
      const st = statusOf(stu);
      const isChecked = selectedIds.has(stu.id);
      const row = h(`<div class="dm-stu-row ${isChecked ? "selected" : ""}" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-bottom:1px solid var(--line-subtle);border-radius:6px;background:${isChecked ? "var(--accent-soft)" : "transparent"}">
        <label style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer">
          <input type="checkbox" data-dmchk="${stu.id}" ${isChecked ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer">
          <span class="no" style="width:24px;height:24px;border-radius:6px;background:var(--surface-2);display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--muted);flex:none">${idx + 1}</span>
          <div style="min-width:0;flex:1">
            <div style="font-weight:700;font-size:13.5px;color:var(--fg-heading);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">
              ${esc(stu.nama || "(Nama belum diisi)")}
              ${stu.panggilan ? `<span style="font-weight:500;font-size:12px;color:var(--muted)">(${esc(stu.panggilan)})</span>` : ""}
            </div>
          </div>
          <span class="chip ${st}" style="font-size:10.5px;padding:2px 8px">${STATUS_LABEL[st]}</span>
          ${stu.contoh ? `<span class="chip kosong" style="font-size:10.5px;padding:2px 6px">Contoh</span>` : ""}
        </label>
        <div style="display:flex;gap:6px;flex:none">
          <button type="button" class="btn sm ghost" data-dmclearname="${stu.id}" title="Kosongkan hanya teks nama siswa ini untuk diganti nama baru">✏️ Ganti/Kosongkan Nama</button>
          <button type="button" class="btn sm danger" data-dmdelone="${stu.id}" title="Hapus data & nama siswa ini sekarang">🗑️ Hapus</button>
        </div>
      </div>`);

      const chk = row.querySelector(`[data-dmchk="${stu.id}"]`);
      chk.onchange = () => {
        if (chk.checked) selectedIds.add(stu.id);
        else selectedIds.delete(stu.id);
        row.style.background = chk.checked ? "var(--accent-soft)" : "transparent";
        syncSelectionSummary();
      };

      row.querySelector(`[data-dmclearname="${stu.id}"]`).onclick = () => {
        stu.nama = "";
        stu.panggilan = "";
        delete stu.contoh;
        touch(stu);
        render();
        renderModalList();
        toast("✏️ Nama siswa dikosongkan. Silakan ketik nama baru.");
      };

      row.querySelector(`[data-dmdelone="${stu.id}"]`).onclick = () => {
        const nm = stu.nama || "Siswa baru";
        selectedIds.delete(stu.id);
        deleteStudentsByIds([stu.id]);
        renderModalList();
        toast(`🗑️ Data siswa "${nm}" berhasil dihapus.`);
      };

      return row;
    }));
  };

  renderModalList();

  $("#dmSearch", el).oninput = (e) => {
    searchQuery = e.target.value.toLowerCase().trim();
    renderModalList();
  };

  $("#dmSelectAll", el).onclick = () => {
    S.students
      .filter((stu) => !searchQuery || (stu.nama || "").toLowerCase().includes(searchQuery) || (stu.panggilan || "").toLowerCase().includes(searchQuery))
      .forEach((stu) => selectedIds.add(stu.id));
    renderModalList();
  };

  $("#dmSelectNone", el).onclick = () => {
    selectedIds.clear();
    renderModalList();
  };

  const btnDelDemo = $("#dmDelDemo", el);
  if (btnDelDemo) {
    btnDelDemo.onclick = () => {
      const demoIds = S.students.filter((s) => s.contoh).map((s) => s.id);
      if (!demoIds.length) return toast("Tidak ada siswa contoh.");
      const n = deleteStudentsByIds(demoIds);
      btnDelDemo.remove();
      renderModalList();
      toast(`🧹 ${n} data siswa contoh berhasil dihapus.`);
    };
  }

  btnClearSel.onclick = () => {
    if (!selectedIds.size) return;
    let count = 0;
    S.students.forEach((stu) => {
      if (selectedIds.has(stu.id)) {
        stu.input = { kegiatanSkip: [], kegiatanKeagamaanSkip: [] };
        stu.final = {};
        delete stu.contoh;
        queueSave(stu.id);
        count++;
      }
    });
    render();
    renderModalList();
    toast(`🔄 Data isian & narasi untuk ${count} siswa telah direset (nama siswa tetap dipertahankan).`);
  };

  btnDelSel.onclick = () => {
    if (!selectedIds.size) return;
    const ids = [...selectedIds];
    selectedIds.clear();
    const n = deleteStudentsByIds(ids);
    renderModalList();
    toast(`🗑️ ${n} data siswa berhasil dihapus.`);
  };

  const btnDelAll = $("#dmDelAll", el);
  btnDelAll.onclick = () => {
    if (!S.students.length) return;
    if (!btnDelAll.dataset.armed) {
      btnDelAll.dataset.armed = "1";
      btnDelAll.textContent = "⚠️ Yakin Hapus Semua? Klik Lagi";
      setTimeout(() => {
        if (btnDelAll.isConnected) {
          delete btnDelAll.dataset.armed;
          btnDelAll.textContent = "🔥 Hapus Semua Siswa";
        }
      }, 4000);
      return;
    }
    delete btnDelAll.dataset.armed;
    btnDelAll.textContent = "🔥 Hapus Semua Siswa";
    const allIds = S.students.map((s) => s.id);
    selectedIds.clear();
    const n = deleteStudentsByIds(allIds);
    renderModalList();
    toast(`🗑️ Seluruh daftar siswa (${n} siswa) berhasil dihapus.`);
  };
}

/* ================= Editor Geser & Pas-kan Foto di Frame (Gaya Canva) ================= */
function drawInteractiveFrameCanvas(cv, img, frameMeta, cfgIn, opts = {}) {
  if (!cv) return { fx: 0, fy: 0, fw: 100, fh: 100, boxW: 100, boxH: 100 };
  const ctx = cv.getContext("2d");
  const cw = cv.width, ch = cv.height;
  ctx.clearRect(0, 0, cw, ch);

  const shape = frameMeta?.shape || "cloud";
  const aspect = (frameMeta?.w || 53.2) / Math.max(1, frameMeta?.h || 49.8);
  const scaleFactor = opts.large ? 0.68 : (opts.showGhost ? 0.74 : 0.82);
  let fw = cw * scaleFactor;
  let fh = fw / aspect;
  if (fh > ch * scaleFactor) {
    fh = ch * scaleFactor;
    fw = fh * aspect;
  }
  const fx = (cw - fw) / 2;
  const fy = (ch - fh) / 2 - (shape === "cloud" ? fh * 0.04 : 0);

  const pad = shape === "cloud" ? fw * (16 / 628.88) : 0;
  const boxX = fx - pad, boxY = fy - pad, boxW = fw + pad * 2, boxH = fh + pad * 2;
  const cfg = cfgIn || { x: 0, y: 0, zoom: 1, fit: "cover", bg: "blur", rot: 0 };

  // 1. Latar luar kanvas (Selalu terang - Putih & Hijau Lembut Al Fakhir)
  if (opts.darkBg) {
    ctx.fillStyle = "#eef9f3";
    ctx.fillRect(0, 0, cw, ch);
  } else {
    ctx.fillStyle = "#fff5f6";
    ctx.fillRect(0, 0, cw, ch);
  }

  // 2. Gambar bayangan luar frame (Ghost Uncropped Preview seperti Canva saat geser foto)
  if (img && opts.showGhost) {
    const rot = (((cfg.rot || 0) % 360) + 360) % 360;
    const swapped = rot === 90 || rot === 270;
    const effW = swapped ? img.height : img.width;
    const effH = swapped ? img.width : img.height;
    const fit = cfg.fit === "contain" ? "contain" : "cover";
    const zoom = Math.max(0.25, Math.min(4, cfg.zoom || 1));
    const baseSc = fit === "contain"
      ? Math.min(boxW / effW, boxH / effH)
      : Math.max(boxW / effW, boxH / effH);
    const sc = baseSc * zoom;
    const cx = boxX + boxW / 2 + ((cfg.x || 0) / 100) * boxW;
    const cy = boxY + boxH / 2 + ((cfg.y || 0) / 100) * boxH;

    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.translate(cx, cy);
    if (rot) ctx.rotate((rot * Math.PI) / 180);
    ctx.drawImage(img, (-img.width * sc) / 2, (-img.height * sc) / 2, img.width * sc, img.height * sc);
    // Garis batas tipis foto asli
    ctx.strokeStyle = "rgba(13, 138, 82, 0.55)";
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.strokeRect((-img.width * sc) / 2, (-img.height * sc) / 2, img.width * sc, img.height * sc);
    ctx.restore();
  }

  // 3. Gambar isi di dalam bentuk Frame (ter-clip sesuai bentuk awan/lingkaran/kotak)
  ctx.save();
  shapePath(ctx, shape, fx, fy, fw, fh);
  ctx.clip();
  if (img) {
    drawPhotoFitted(ctx, img, boxX, boxY, boxW, boxH, cfg);
  } else {
    ctx.fillStyle = "#fce7f3";
    ctx.fillRect(fx - 10, fy - 10, fw + 20, fh + 20);
    ctx.fillStyle = "#a27e8a";
    ctx.font = `700 ${Math.round(fh * 0.09)}px "Plus Jakarta Sans", sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Belum ada foto", fx + fw / 2, fy + fh / 2);
  }

  // Garis bantu Rule of Thirds (3x3) saat sedang digeser dengan mouse
  if (opts.showGrid && img) {
    ctx.strokeStyle = "rgba(255, 255, 255, 0.65)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(fx + fw / 3, fy); ctx.lineTo(fx + fw / 3, fy + fh);
    ctx.moveTo(fx + (fw * 2) / 3, fy); ctx.lineTo(fx + (fw * 2) / 3, fy + fh);
    ctx.moveTo(fx, fy + fh / 3); ctx.lineTo(fx + fw, fy + fh / 3);
    ctx.moveTo(fx, fy + (fh * 2) / 3); ctx.lineTo(fx + fw, fy + (fh * 2) / 3);
    ctx.stroke();
  }
  ctx.restore();

  // 4. Garis tepi (stroke) bentuk Frame
  ctx.save();
  shapePath(ctx, shape, fx, fy, fw, fh);
  ctx.strokeStyle = frameMeta?.border || "#a27e8a";
  ctx.lineWidth = Math.max(2.5, fw * (10 / 628.88));
  ctx.lineJoin = "round";
  ctx.stroke();
  ctx.restore();

  // 5. Jika frame bentuk Awan (bawaan), tampilkan kapsul putih di bawahnya agar guru tahu batas bawah foto & teks keterangan
  const rawBadge = opts.badgeText !== undefined ? String(opts.badgeText) : "Pendidikan";
  const lbl = rawBadge.trim();
  if ((shape === "cloud" || opts.badgeLabel) && opts.badgeLabel !== false && lbl !== "") {
    const scCloud = fw / 628.88;
    const pw = 681.35 * scCloud;
    const ph = 112.97 * scCloud;
    const px = fx;
    const py = fy + fh - 100 * scCloud;
    const r = 31.26 * scCloud;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(px, py, pw, ph, r);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.strokeStyle = "#a27e8a";
    ctx.lineWidth = Math.max(1.8, 6.2 * scCloud);
    ctx.stroke();
    ctx.fillStyle = "#000000";
    let fSize = Math.max(10, Math.round(56 * scCloud));
    const minSize = Math.max(8, Math.round(26 * scCloud));
    for (; fSize > minSize; fSize -= 1) {
      ctx.font = `700 ${fSize}px "Plus Jakarta Sans", sans-serif`;
      if (ctx.measureText(lbl).width <= pw - 96 * scCloud) break;
    }
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    ctx.fillText(lbl, px + 62 * scCloud, py + ph / 2 + 1);
    ctx.restore();
  }

  return { fx, fy, fw, fh, boxW, boxH };
}

              <button type="button" class="stu-photo-quick-btn ${draft.fit === "cover" ? "active" : ""}" data-pcfit="cover" style="padding:8px">
                🖼️ <b>Isi Penuh Frame</b><br><span style="font-size:10.5px;color:var(--muted);font-weight:500">Penuh mengikuti bentuk frame (bisa digeser)</span>
              </button>
              <button type="button" class="stu-photo-quick-btn ${draft.fit === "contain" ? "active" : ""}" data-pcfit="contain" style="padding:8px">
                📐 <b>Muat Utuh Potret</b><br><span style="font-size:10.5px;color:var(--muted);font-weight:500">Seluruh foto masuk tanpa ada yang kepotong</span>

              <input type="range" id="pcZoom" min="0.35" max="3.0" step="0.02" value="${draft.zoom}">

          <!-- Pengaturan Geser Horizontal (X) -->
